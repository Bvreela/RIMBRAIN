# Endpoint registry — named, nonsecret LLM endpoints (UR-MOD-011/012).
# Secrets live elsewhere: api_key_ref names an env var or config.local.yaml key.
# Hand-editable; the UI (feature 002) reads/writes this same file.
endpoints:
  - id: openrouter
    label: "OpenRouter — remote planning/review"
    api: openai-compat
    base_url: https://openrouter.ai/api/v1
    api_key_ref: env:OPENROUTER_API_KEY
    strict: false                           # tolerates extra_body (incl. reasoning.enabled)
    models:
      - nvidia/nemotron-3-ultra-550b-a55b:free   # VERIFIED 2026-09-22: chat + tool_calls + reasoning.enabled
    capabilities: [chat, tool_calls, reasoning]
    notes: "Free tier. reasoning:{enabled:true} works via extra_body — the extension field strict endpoints like Gemini would reject."
  - id: gemini
    label: "Gemini API (remote planning/review)"
    api: openai-compat                      # via https://generativelanguage.googleapis.com/v1beta/openai
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_ref: env:GEMINI_API_KEY         # never inline the key
    strict: true                            # rejects unknown request fields (e.g. chat_template_kwargs -> 400)
    models:
      - gemini-3.5-flash-lite               # VERIFIED 2026-09-22: chat + tool_calls work, fast, free-tier ok
      - gemma-4-31b-it                      # preferred planner size; was 503 demand-limited at probe time
      - gemini-3.5-flash                    # stronger, unverified here
      - gemini-2.5-pro                      # strongest, unverified here
    capabilities: [chat, tool_calls]        # verified on gemini-3.5-flash-lite only
    notes: "gemma-4-4b-it (user's initial pick) does NOT exist on the API — closest are gemma-4-31b-it / gemma-4-26b-a4b-it. Full list: GET /v1beta/openai/models."

  - id: local-laya
    label: "Laya System-1 decision server — action-matrix (select)"
    api: systemone                          # typed-decisions wire format: POST {state, questions} -> calibrated answers
    decide_path: /v1/systemone
    base_url: http://127.0.0.1:8780
    api_key_ref: null                       # local, open (LAYA_API_KEY env can require Bearer)
    models: [laya, english, jev-latest]     # served names per /v1/models (ggmlc ModernBERT-large, 421M, ctx 512; 'laya_english_q8_0' is the FILE name, not a served id)
    capabilities: [typed_decisions]         # choice/score/noul in one encoder pass; ~55ms/4 questions on RTX 5060 Ti
    serve:                                  # lets the overlay Start the server (mirrors tools/serve-laya.ps1)
      cmd: ["J:/RimAgent/models/laya/laya.exe", "serve",
            "J:/RimAgent/models/laya/laya_english_q8_0.gguf",
            "--port", "8780", "--device", "auto", "--cuda-graph"]
      path_prepend:                         # CUDA-12 pip-wheel DLLs must be on PATH
        - J:/RimAgent/models/laya/.venv/Lib/site-packages/nvidia/cuda_runtime/bin
        - J:/RimAgent/models/laya/.venv/Lib/site-packages/nvidia/cublas/bin
    notes: "Verified live 2026-09-22 via tools/serve-laya.ps1. Native binary at J:\\RimAgent\\models\\laya (ggmlc v0.9.2 sm89, needs CUDA-12 pip-wheel DLLs on PATH). Decision Studio UI at GET /."

  - id: openrouter-decisions
    label: "OpenRouter hosted decisions — select-tier fallback"
    api: systemone                          # same wire shape as local-laya, different path
    decide_path: /api/alpha/decisions
    base_url: https://openrouter.ai
    api_key_ref: env:OPENROUTER_API_KEY
    strict: true                            # decisions endpoint validated; keep payloads clean
    models:
      - "~typesafe/jev-latest"              # resolves to typesafe/jev-1.13-20260917 — VERIFIED 2026-09-22: 428ms, choice/score/noul, ~$0.000018/call
    capabilities: [typed_decisions]
    notes: "Remote backup for rimbrain.select when local-laya is down. answers.{q}.{choice|score|noul,probabilities,confidence} — same response schema as local."

  - id: local-lmstudio
    label: "LM Studio — detected on this machine"
    api: openai-compat
    base_url: http://127.0.0.1:1234/v1
    api_key_ref: null
    models:
      - llama-3.2-3b-instruct-uncensored
      - rimdialogue-8b-v1-paperwitch-heresy
      - rimtalk-mini-v1
      - google/gemma-4-e4b
      - text-embedding-nomic-embed-text-v1.5
    capabilities: [chat, embeddings]
    notes: "Auto-detected 2026-09-22; model list is live-advertised, re-probe on use."
