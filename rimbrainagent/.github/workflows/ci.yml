# Superproject CI stub — inert until portable component remotes exist (FR-014).
# Runs the offline-tier gates: corpus validation, acceptance tests, baseline integrity.
name: rimbrainagent-ci
on:
  push:
  pull_request:
jobs:
  offline-tier:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Baseline integrity
        run: python tools/baseline_validate.py
      - name: Contract corpus
        run: python tests/contract/corpus_runner.py validate-corpus
      - name: Acceptance tests
        run: pip install pytest jsonschema pyyaml && python -m pytest tests/acceptance tests/contract components/contracts/tests components/lab/tests -q
      # .NET mod suites + game-dependent tiers run on self-hosted Windows with RimWorld.
