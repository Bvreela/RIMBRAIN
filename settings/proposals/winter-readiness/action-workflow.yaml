schema_version: 1
id: workflows.first_winter
revision: 1
status: proposed

workflows:
  - id: workflow.prepare_first_winter
    goal_predicate: first_winter_readiness_satisfied
    nodes:
      - {id: observe, type: observe, requires: [], query: first_winter_readiness}
      - {id: close_gaps, type: task, requires: [observe], task_template_id: task.close_winter_readiness_gap}
      - {id: verify, type: verify, requires: [close_gaps], predicate: first_winter_readiness_satisfied}
    on_failure: replan_or_escalate

execution:
  schedule_ready_nodes_through_attention_cycler: true
  direct_rpc_nodes_allowed: false
  revalidate_before_each_task: true
  interrupt_on_emergency: true
