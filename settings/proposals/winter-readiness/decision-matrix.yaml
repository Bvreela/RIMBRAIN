schema_version: 1
id: matrices.first_winter
revision: 1
status: proposed

matrices:
  - id: matrix.winter_preparation
    domain: shelter
    rows:
      - id: winter.verified_gap
        priority: 100
        when_all: [first_winter_readiness_failed, no_higher_priority_emergency]
        productive_options:
          - {id: MAKE_CLOTHING, action_template: make_cold_weather_clothing}
          - {id: FUEL_HEAT, action_template: fuel_existing_heat}
          - {id: BUILD_HEAT, action_template: build_available_heat}
          - {id: INSULATE, action_template: improve_insulation}
        fallback_options: [CONTINUE, ESCALATE]
        verify: first_winter_readiness_improved
