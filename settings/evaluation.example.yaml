# Controlled evaluation and promotion rules.
schema_version: 1
id: evaluation.default
revision: 2
status: draft

scenario_sets:
  development:
    - id: crashlanded_temperate_food_shortage
      seeds: [101, 102, 103]
      max_game_days: 15
    - id: crashlanded_cold_shelter_pressure
      seeds: [201, 202, 203]
      max_game_days: 20
    - id: crashlanded_mining_capacity_tradeoffs
      seeds: [301, 302, 303]
      max_game_days: 30
  held_out:
    - id: crashlanded_mixed_pressure
      seeds: [901, 902, 903]
      max_game_days: 30
    - id: crashlanded_unseen_shelter_terrain
      seeds: [911, 912, 913]
      max_game_days: 30

building_comparisons:
  status: planned_not_executed
  require_same_start_save_per_controller_comparison: true
  record_pawns_resources_map_and_incident_settings: true
  strata: [low_mining_capacity, high_mining_capacity, unavailable_skilled_miner, no_open_space, urgent_shelter]
  compare: [declared_baseline, skill_aware_strategy, skill_aware_strategy_with_reviewed_lessons]
  isolate_fire_and_security_claims: matched_incident_save_branches
  structural_material_comparison: include_surface_stone_as_well_as_surface_wood
  incidents_not_observed: report_unknown_not_zero_risk
  freeze_policy_and_lesson_revisions: true
  held_out_results_visible_to: evaluator_only

metrics:
  primary:
    - colony_survival
    - colonist_survival
    - maintenance_satisfied_hours
  secondary:
    - time_to_food_security
    - time_to_suitable_shelter
    - shelter_completion_forecast_error
    - shelter_labor_hours
    - displaced_survival_labor_hours
    - structural_fire_losses
    - shelter_breach_losses
    - repeated_failure_rate_in_matching_contexts
    - avoidable_mental_breaks
    - time_to_useful_research_capability
    - game_writes
    - planner_calls
    - selector_calls
  guardrails:
    - unvalidated_actions
    - human_override_conflicts
    - emergency_response_failures

regression_fixtures:
  - already_satisfied_goal
  - missing_observation
  - stale_provider_reply
  - conflicting_resource_locks
  - interrupted_workflow
  - human_owned_steward_queue
  - selector_returns_unoffered_option
  - workflow_dependency_cycle
  - low_mining_prefers_feasible_surface_shelter
  - high_available_mining_makes_excavation_competitive
  - high_skill_miner_is_only_cook
  - miner_lost_mid_excavation
  - low_construction_capacity_delays_finishing
  - no_open_rectangle_requires_alternative_search
  - unknown_roof_support_blocks_excavation_phase
  - urgent_shelter_requires_temporary_solution
  - temporary_shelter_retained_until_replacement_usable
  - fire_resistance_uses_actual_materials
  - lesson_context_mismatch
  - lesson_counterevidence_preserved
  - synthetic_lesson_cannot_promote
  - held_out_outcomes_cannot_enter_active_lessons

promotion:
  require_zero_guardrail_regressions: true
  require_development_improvement: true
  require_no_held_out_regression: true
  require_matched_baseline_revision: true
  require_reviewable_evidence: true
  activation: human_approval
