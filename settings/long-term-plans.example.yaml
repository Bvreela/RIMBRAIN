# Long-horizon intent; the runtime materializes only the current goals/tasks.
schema_version: 1
id: plans.colony_survival
revision: 2
status: draft

plans:
  - id: plan.first_year_survival
    objective_ids:
      - objective.food_security
      - objective.suitable_shelter
      - objective.stable_mood
      - objective.useful_research
      - objective.defensive_readiness
    horizon_game_days: 60
    strategy: Establish stable maintenance, using temporary shelter when needed and proposing durable shelter upgrades when available pawn capacity justifies them.
    building_strategy_id: building.colony
    assumptions:
      - scenario_and_mod_catalog_validated
      - at_least_one_controllable_colonist
    constraints:
      - maintain_food_shelter_and_mood_during_later_stages
      - use_only_registered_actions_and_predicates
      - preserve_human_owned_settings
    milestones:
      - id: milestone.food_stable
        goal: food_maintenance_satisfied
        workflow_id: workflow.secure_food
        depends_on: []
      - id: milestone.shelter_stable
        goal: shelter_maintenance_satisfied
        workflow_id: workflow.secure_shelter
        depends_on: []
      - id: milestone.mood_stable
        goal: mood_maintenance_satisfied
        workflow_id: workflow.stabilize_mood
        depends_on: [milestone.food_stable, milestone.shelter_stable]
      - id: milestone.useful_unlock
        goal: selected_research_capability_observed_in_use
        workflow_id: workflow.advance_research
        depends_on: [milestone.food_stable, milestone.shelter_stable, milestone.mood_stable]
      - id: milestone.defense_ready
        goal: defensive_readiness_satisfied
        workflow_id: workflow.prepare_defense
        depends_on: [milestone.food_stable, milestone.shelter_stable]
    replan_triggers:
      - milestone_infeasible
      - maintenance_state_changed
      - colonist_joined_or_lost
      - miner_or_builder_capacity_changed
      - shelter_upgrade_value_changed
      - biome_or_season_constraint_changed
      - threat_profile_changed
      - human_objective_changed
    completion: all_milestone_goals_satisfied
