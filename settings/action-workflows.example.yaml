# Reusable DAGs that instantiate bounded tasks; they do not contain arbitrary RPC calls.
schema_version: 1
id: workflows.core
revision: 2
status: draft

workflows:
  - id: workflow.secure_food
    goal_predicate: food_maintenance_satisfied
    nodes:
      - {id: observe, type: observe, requires: [], query: food_inventory}
      - {id: recover, type: task, requires: [observe], task_template_id: task.restore_food_buffer}
      - {id: verify, type: verify, requires: [recover], predicate: food_maintenance_satisfied}
    on_failure: replan_or_escalate

  - id: workflow.secure_shelter
    goal_predicate: shelter_maintenance_satisfied
    nodes:
      - {id: observe, type: observe, requires: [], query: shelter_state}
      - {id: select, type: task, requires: [observe], task_template_id: task.select_shelter_site}
      - {id: prepare, type: task, requires: [select], task_template_id: task.advance_shelter_site}
      - {id: recover, type: task, requires: [prepare], task_template_id: task.provide_safe_sleeping_space}
      - {id: verify, type: verify, requires: [recover], predicate: shelter_maintenance_satisfied}
    on_failure: replan_or_escalate

  - id: workflow.stabilize_mood
    goal_predicate: mood_maintenance_satisfied
    nodes:
      - {id: observe, type: observe, requires: [], query: mood_drivers}
      - {id: remedy, type: task, requires: [observe], task_template_id: task.remedy_avoidable_mood_risk}
      - {id: verify, type: verify, requires: [remedy], predicate: mood_maintenance_satisfied}
    on_failure: replan_or_escalate

  - id: workflow.advance_research
    goal_predicate: selected_research_capability_observed_in_use
    nodes:
      - {id: gates, type: verify, requires: [], predicate: research_maintenance_gates_pass}
      - {id: advance, type: task, requires: [gates], task_template_id: task.advance_research_priority}
      - {id: verify, type: verify, requires: [advance], predicate: selected_research_capability_observed_in_use}
    on_failure: suspend_research_and_replan

  - id: workflow.prepare_defense
    goal_predicate: defensive_readiness_satisfied
    nodes:
      - {id: observe, type: observe, requires: [], query: defensive_readiness}
      - {id: prepare, type: task, requires: [observe], task_template_id: task.prepare_defensive_readiness}
      - {id: verify, type: verify, requires: [prepare], predicate: defensive_readiness_satisfied}
    on_failure: escalate

  - id: workflow.respond_threat
    goal_predicate: threat_resolved_or_human_takes_control
    nodes:
      - {id: observe, type: observe, requires: [], query: active_threat_state}
      - {id: respond, type: task, requires: [observe], task_template_id: task.respond_to_active_threat}
      - {id: verify, type: verify, requires: [respond], predicate: threat_resolved_or_human_takes_control}
    on_failure: pause_and_escalate

execution:
  schedule_ready_nodes_through_attention_cycler: true
  direct_rpc_nodes_allowed: false
  revalidate_before_each_task: true
  persist_node_outcomes: true
  interrupt_on_emergency: true
  already_satisfied_node: verify_and_complete_without_game_writes
  already_satisfied_workflow_goal: verify_and_complete_without_instantiating_tasks
  lessons_policy_id: learning.lessons
