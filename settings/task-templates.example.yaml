# Bounded task intents. Actions and predicates must already exist in registries.
schema_version: 1
id: tasks.core
revision: 2
status: draft

templates:
  - id: task.restore_food_buffer
    domain: food
    required_observations: [food_inventory, colonists, safe_map_opportunities]
    preconditions: [food_maintenance_failed, no_higher_priority_emergency]
    matrix_id: matrix.food_recovery
    allowed_action_templates: [cook_existing, forage_safe, plant_emergency_crop, adjust_food_policy]
    verification: food_inventory_improved
    retry_limit: 2
    timeout_game_hours: 12
    stop_when: food_maintenance_satisfied

  - id: task.select_shelter_site
    domain: shelter
    required_observations: [shelter_state, pawn_work_capacity, map_build_candidates, applicable_lessons]
    preconditions: [shelter_site_plan_needed, shelter_candidates_ready]
    matrix_id: matrix.shelter_site
    building_strategy_id: building.colony
    allowed_action_templates: [select_reuse_site, select_open_site, select_excavation_site, select_hybrid_site]
    verification: selected_site_plan_validated_and_reserved
    retry_limit: 2
    timeout_game_hours: 1
    stop_when: selected_site_plan_validated_and_reserved

  - id: task.advance_shelter_site
    domain: shelter
    required_observations: [selected_site_plan, phase_progress, pawn_work_capacity, current_map_safety]
    preconditions: [selected_site_plan_validated_and_reserved, next_site_phase_ready]
    matrix_id: matrix.shelter_phase
    allowed_action_templates: [clear_validated_phase, mine_validated_phase, construct_validated_phase, inspect_site_phase]
    verification: selected_site_ready_for_sleep_assignments
    execution:
      unit: one_bounded_ready_phase_per_attention_decision
      phase_cursor: persisted_in_selected_site_plan
      retry_scope: failed_attempt_within_phase
      phase_success: advance_cursor_only_after_observed_completion
      deadline_source: validated_site_plan_with_temporary_shelter_gate
      plan_invalidation: suspend_release_unused_reservations_and_replan
    retry_limit: 2
    timeout_game_hours: 72
    stop_when: selected_site_ready_for_sleep_assignments

  - id: task.provide_safe_sleeping_space
    domain: shelter
    required_observations: [colonists, beds, rooms, weather]
    preconditions: [shelter_maintenance_failed, construction_area_safe]
    matrix_id: matrix.shelter_recovery
    allowed_action_templates: [assign_existing_bed, build_sleeping_spot, build_basic_bed, repair_shelter]
    verification: every_colonist_has_legal_sleep_assignment
    retry_limit: 2
    timeout_game_hours: 12
    stop_when: shelter_maintenance_satisfied

  - id: task.remedy_avoidable_mood_risk
    domain: mood
    required_observations: [colonist_needs, active_thoughts, schedules, policies]
    preconditions: [mood_maintenance_failed, no_immediate_physical_emergency]
    matrix_id: matrix.mood_recovery
    allowed_action_templates: [schedule_recreation, address_urgent_need, adjust_allowed_policy, improve_room]
    verification: targeted_mood_driver_improved
    retry_limit: 2
    timeout_game_hours: 18
    stop_when: mood_maintenance_satisfied

  - id: task.advance_research_priority
    domain: research
    required_observations: [research_state, research_catalog, benches, labor_reservations]
    preconditions: [research_maintenance_gates_pass, no_conflicting_human_queue]
    matrix_id: matrix.research_next
    allowed_action_templates: [continue_current_research, select_validated_project, staff_research_bench]
    verification: research_progress_or_capability_use_observed
    retry_limit: 1
    timeout_game_hours: 24
    stop_when: selected_research_capability_observed_in_use

  - id: task.respond_to_active_threat
    domain: combat
    required_observations: [threats, colonists, injuries, safe_positions, steward_orders]
    preconditions: [active_threat, combat_stage_enabled]
    matrix_id: matrix.combat_response
    allowed_action_templates: [activate_steward_combat, retreat_to_safe_area, rescue_down_pawn, hold_current_defense]
    verification: threat_state_reobserved
    retry_limit: 1
    timeout_game_hours: 1
    stop_when: threat_resolved_or_human_takes_control

  - id: task.prepare_defensive_readiness
    domain: combat
    required_observations: [threat_profile, equipment, defensive_positions, steward_orders]
    preconditions: [combat_stage_enabled, no_active_threat, maintenance_gates_pass]
    matrix_id: matrix.defense_preparation
    allowed_action_templates: [equip_available_protection, prepare_safe_position, set_rally_area, request_defense_research]
    verification: defensive_readiness_satisfied
    retry_limit: 1
    timeout_game_hours: 24
    stop_when: defensive_readiness_satisfied
