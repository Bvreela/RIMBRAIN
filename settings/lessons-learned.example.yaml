# Human-editable policy for a proposed persistent lesson ledger; not a runtime implementation.
schema_version: 1
id: learning.lessons
revision: 1
status: draft

storage:
  trace_store: immutable_run_events
  lesson_store: append_only_cross_episode_ledger
  stable_lesson_id: true
  revision_on_change: true
  retain_superseded_and_contradicted_records: true
  deduplicate_evidence_by: [start_save_id, episode_id, task_attempt_id, observation_revision]
  human_annotations: append_with_author_and_time
  machine_assertions_require: source_trace_references

capture:
  triggers:
    - task_success_or_failure
    - completion_forecast_error
    - emergency_or_worker_change_invalidates_plan
    - phase_or_episode_review
    - human_supplied_strategy_prior
  domains: [food, shelter, mood, research, combat]
  include_successes_failures_and_near_misses: true
  separate_observation_from_causal_hypothesis: true
  unchosen_option_outcome: unknown_unless_measured_in_a_separate_trial

record_contract:
  required_fields:
    - lesson_id
    - revision
    - status
    - provenance
    - statement
    - applies_when
    - exceptions
    - context
    - trace_refs
    - expected_vs_observed
    - evidence
    - failure_class
    - confidence
    - alternative_explanations
    - proposed_change
    - review
  statuses: [prior, hypothesis, supported, contradicted, superseded]
  provenance_kinds: [user_prior, source_prior, gameplay_observation, controlled_trial, synthetic_example]
  context_fields:
    - game_version_mod_manifest_and_policy_revision
    - start_save_episode_and_map_identity
    - biome_terrain_roof_and_threat_conditions
    - pawn_skills_effective_rates_and_reserved_hours
    - material_supply_weather_and_shelter_deadline
    - selected_candidate_and_rejected_alternatives
  trace_fields: [plan_id, goal_id, task_id, attempt_id, decision_id, phase_ids, event_refs]
  evidence_fields: [supporting_refs, contradicting_refs, independent_start_count, metrics, observation_windows]
  absent_observation: null_with_missing_reason
  confidence_basis: evidence_strength_and_independent_context_coverage_not_provider_certainty
  prior_or_synthetic_record: may_have_no_game_trace_but_never_counts_as_gameplay_evidence

retrieval:
  before: [strategic_planning, site_selection, task_retry, failure_review]
  match_on: [game_and_mod_compatibility, domain, map_conditions, pawn_capacity, deadline, material_supply]
  rank_by: [context_match, evidence_quality, independent_start_coverage, recency]
  context_mismatch: exclude_and_record_reason
  conflicting_lessons: show_both_with_scope_and_counterevidence
  log: [lesson_id, lesson_revision, relevance_reason, effect_on_candidate_ranking]
  missing_relevant_lesson: continue_with_declared_base_policy
  facts_and_hard_constraints_override_lessons: true

evaluation_isolation:
  development_lessons: may_inform_new_proposals
  held_out_outcomes: evaluator_only_until_test_set_is_retired
  freeze_lesson_snapshot_for_scored_episode: true
  new_records_during_scored_episode: append_but_do_not_retrieve_until_next_approved_snapshot
  active_snapshot_members: reviewed_supported_lessons_and_explicitly_declared_priors
  hypothesis_retrieval: reviewer_only_until_approved_as_an_explicit_prior
  synthetic_examples_retrievable_in_live_play: false

promotion:
  writes_to_active_settings: false
  proposed_change_requires: [affected_layer, settings_diff, acceptance_metric, rejection_condition, rollback_revision]
  supported_status_requires:
    - real_trace_evidence
    - context_matched_repetition
    - reviewed_counterevidence_and_alternative_causes
  minimum_independent_start_saves: 3
  minimum_is: experimental_review_floor_not_statistical_proof
  gameplay_policy_change_requires: [regression_fixtures, matched_save_trials, held_out_check, human_approval]
  new_action_or_predicate_requires: code_review_and_adapter_tests
  active_revision_changes: through_existing_atomic_policy_promotion
  status_change_requires: reviewed_evidence_record
  rollback_preserves_lesson_and_evidence: true

review_surface:
  show:
    - context_and_applicability
    - prediction_vs_observation
    - supporting_and_contradicting_trials
    - prior_hypothesis_or_supported_status
    - policy_diff_and_evaluation_outcome
    - where_the_lesson_influenced_a_decision
  actions: [annotate, request_trial, approve_proposal, reject_proposal, supersede, roll_back_policy]
