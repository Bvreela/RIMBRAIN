# Live smoke config (feature 003 T055): one checkpoint, one ~1h window,
# zero retries — minimal churn against the running colony.
schema_version: 0
config_id: rl.smoke-live-001   # rl.* id kind (common/id grammar)

window_hours: 1
max_retries: 1                # schema floor is 1; early_exit stops after window 1
speed: 3

checkpoint_family: retry      # namespaced; never touches user saves (FR-206)

gate_ref: gate.smoke-colony-v1
mutation_space_ref: muts.smoke-v1

budgets:
  per_window_s: 120
  total_s: 300

# Gate over real game.status fields (colonists survives reload; game is
# restored paused at the checkpoint, so pause state is not asserted).
gate:
  combinator: all
  predicates:
    - {id: colony-alive, field: colonists, op: gte, value: 3}

mutation_space:
  - id: noop-bump
    apply: {path: plan.priorities.0.weight, op: bump, value: 0}

candidate:
  plan:
    window: day
    priorities:
      - {task: mine, weight: 1}
      - {task: haul, weight: 2}
