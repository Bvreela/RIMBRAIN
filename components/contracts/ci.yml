# CI stub for the contracts component (future rimbrainagent-contracts remote).
# Inert until a portable remote exists (FR-014). When wired up, this workflow
# runs the component's own test suite only: schemas are authoritative and this
# component must not depend on any other project component.
name: contracts-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install jsonschema pyyaml pytest

      - name: Component tests
        # Repo root of the future submodule is this component directory.
        run: python -m pytest tests -q
