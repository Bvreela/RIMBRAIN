# Improvement cycle pack (feature 009; FR-801/803/808).
# Config for the self-improvement loop: defect patterns, metric
# weights, audit gates, cadence. Templates are inert here — the cycle
# writes candidate packs, never direct game actions.
schema_version: 0
pack_id: pack.improve-v0
revision: v0.1

templates:
  - id: noop
    method: game.status          # read-only; keeps the pack loadable
    params_schema:
      type: object
      additionalProperties: true
    description: sentinel — the improvement loop makes no game writes

jobs: [improve]
decision_map: []
emergency: []

improve:
  cadence:
    episodes_per_cycle: 1        # run a self-check after every episode
    max_iterations: 20           # hard bound — never a runaway
  defect_patterns:
    - id: repeated_refusal
      event_type: action.refused
      group_by: payload.template_id
      min_count: 2               # same template refused >=N times
      remediation: fix_template_params
    - id: params_invalid
      event_type: action.refused
      group_by: payload.error.code
      match_value: dispatch.params_invalid
      min_count: 1
      remediation: fix_template_params
    - id: verify_failure
      event_type: task.transition
      group_by: payload.kind
      match_to_state: [failed, expired]
      min_count: 2
      remediation: retune_lease_or_effect
    # Colony-health failure classes (FR-812) — outcome defects, not
    # dispatch failures. `where` predicates run over event fields;
    # `window_ticks` bounds the count window (3.6M ticks = 1 game year);
    # dict remediation declares the mutation ops applied to a candidate.
    - id: poor_mood
      event_type: colony.vitals
      where: {field: payload.mood_min, op: lt, value: 30}
      group_by: event_type            # colony-wide signal, one group
      min_count: 3                    # sustained across >=3 samples
      remediation:
        ops:
          # more meal buffer + a second joy source relieve mood pressure
          - {op: set_cfg, path: start.cooking.buffer, value: 6}
          - {op: append, path: start.recreation.defs, value: Telescope}
    - id: repeat_sickness
      event_type: colony.sickness
      group_by: payload.pawn          # per-pawn illness frequency
      window_ticks: 3600000           # RimWorld game year (4x15 days)
      min_count: 2                    # >1 sickness in a year = hygiene fail
      remediation:
        ops:
          # prefer built stoves over campfires — cleaner kitchens,
          # less food poisoning
          - {op: set_cfg, path: start.cooking.station_defs,
             value: [ElectricStove, FueledStove, Campfire]}
    - id: multiple_downed
      event_type: colony.vitals
      where: {field: payload.downed, op: gte, value: 2}
      group_by: event_type
      min_count: 1                    # any single sample is a failure
      remediation:
        ops:
          # stop chasing routers — retreat posture until defenses improve
          - {op: drop_rule, ids: [chase-fleeing]}
    - id: colonist_death
      event_type: colony.vitals
      where: {field: payload.dead, op: gte, value: 1}
      group_by: event_type
      min_count: 1                    # one death is one too many
      remediation:
        ops:
          - {op: drop_rule, ids: [chase-fleeing]}
          # heavier armor preference on the front-line pawn
          - {op: set_cfg, path: start.arm.armor_defs,
             value: [Apparel_PlateArmor, Apparel_FlakJacket,
                     Apparel_FlakVest, Apparel_Duster, Apparel_Jacket]}
  metrics:
    refusal_rate: 0.4            # weights for candidate scoring
    verify_failure_rate: 0.3
    task_completion_rate: 0.3
    min_events: 5                # evidence floor — below -> defer
  audit_gates:                   # all must pass before promotion
    - code.suite
    - policy.invariant
    - ux.feed_coverage
  promotion:
    episode_boundary_only: true  # immutability invariant
    incumbent_wins_ties: true    # stability bias
