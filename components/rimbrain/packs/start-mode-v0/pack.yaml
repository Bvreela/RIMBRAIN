      rect: '@fn:rect(@fn:add(@var:site.min.0, 1), @fn:add(@var:site.min.1, 1), @fn:sub(@cfg:start.shelter.room_w,
        2), @fn:sub(@cfg:start.shelter.room_h, 2))'
