         params: {def: "@fn:first(@cfg:start.recreation.defs)",
                  at: "@fn:free_cell(@fn:first(@cfg:start.recreation.defs), @fn:rect(@fn:add(@var:site.min.0, @cfg:start.shelter.room_w, 1), @var:site.min.1, 3, @cfg:start.shelter.room_h), 0, @fn:stuff(@cfg:start.shelter.stuff_preference))",
                  stuff: "@fn:stuff(@cfg:start.shelter.stuff_preference)"}}
  - id: establish-power-grid  # first generator online — sited on a
