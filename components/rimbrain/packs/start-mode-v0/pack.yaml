# feature 020: declarative room archetypes (room-archetypes/v0). The
# bedroom archetype is the barracks AND the private-bedroom recipe —
# size is the interior footprint; plan_room compiles it to build-layout
# ops at the goal's site rect.
rooms:
  tier_table: auto
  archetypes:
    bedroom:
      tier_target: average
      stat_target: {impressiveness: 40}
      wall: Wall
      door: Door
      floor: WoodPlankFloor
      stuff_preference:
      - WoodLog
      - Steel
      furniture:
      - {def: Bed, count: 1, anchor: wall}
      - {def: Dresser, linked_to: Bed}
      - {def: EndTable, linked_to: Bed}
      - {def: StandingLamp, count: 1}
      - {def: PlantPot, optional: true}
    dining_hall:
      size: {w: 6, h: 7}
      stat_target: {impressiveness: 40}
      wall: Wall
      door: Door
      floor: WoodPlankFloor
      furniture:
      - {def: Table2x2, count: 2, anchor: free}
      - {def: DiningChair, count: 8, adjacent_to: Table2x2}
    hospital:
      size: {w: 6, h: 6}
      stat_target: {cleanliness: 0}
      wall: Wall
      door: Door
      floor: PavedTile
      furniture:
      - {def: HospitalBed, count: 2, anchor: wall}
      - {def: VitalsMonitor, linked_to: HospitalBed}
    kitchen:
      size: {w: 6, h: 6}
      stat_target: {cleanliness: 0}
      wall: Wall
      door: Door
      floor: PavedTile
      furniture:
      - {def: FueledStove, count: 1, anchor: wall}
      - {def: TableButcher, count: 1, anchor: wall, separate: true}
    workshop:
      size: {w: 8, h: 6}
      stat_target: {impressiveness: 30}
      wall: Wall
      door: Door
      floor: PavedTile
      furniture:
      - {def: SimpleWorkbench, count: 2, anchor: wall}
      - {def: ToolCabinet, links: 2, linked_to: SimpleWorkbench}
      - {def: Stool, at: each_bench}
