      @cfg:govern.power.rect_w, @cfg:govern.power.rect_h), @cfg:govern.power.wind.axis,
      @cfg:govern.power.wind.half_width, @cfg:govern.power.wind.depth, @cfg:govern.power.wind.gap,
      @cfg:govern.power.wind.foot, @cfg:govern.power.wind.site_kinds)'
    params:
      def: '@fn:first(@cfg:govern.power.gen_defs)'
      at: '@fn:turbine_site(@fn:first(@cfg:govern.power.gen_defs), @fn:rect(@fn:add(@var:site.min.0,
