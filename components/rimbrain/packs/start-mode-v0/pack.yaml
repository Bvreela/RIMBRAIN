- id: maintain-turbine-windpath
  option: establish-power-grid
  requires:
  - site
  when:
    field: '@fn:find_def(@fn:first(@cfg:govern.power.gen_defs))'
    op: present
  effect:
    all:
    - field: '@fn:count(@fn:wind_obstructions(@cfg:govern.power.gen_defs, @cfg:govern.power.wind.axis,
        @cfg:govern.power.wind.half_width, @cfg:govern.power.wind.depth, @cfg:govern.power.wind.gap,
        @cfg:govern.power.wind.foot, @cfg:govern.power.wind.site_kinds))'
      op: eq
      value: 0
    - any:
      - field: '@cfg:govern.power.wind.suppress'
        op: ne
        value: floor
      - all:
        - field: '@fn:terrain_at(@fn:nth(@fn:wind_path(@fn:pos(@fn:nth(@fn:find_defs(@cfg:govern.power.gen_defs),0)),
            @cfg:govern.power.wind.axis, @cfg:govern.power.wind.half_width, @cfg:govern.power.wind.depth,
            @cfg:govern.power.wind.gap, @cfg:govern.power.wind.foot),0))'
          op: eq
          value: '@cfg:govern.power.wind.floor_def'
        - field: '@fn:terrain_at(@fn:nth(@fn:wind_path(@fn:pos(@fn:nth(@fn:find_defs(@cfg:govern.power.gen_defs),0)),
            @cfg:govern.power.wind.axis, @cfg:govern.power.wind.half_width, @cfg:govern.power.wind.depth,
            @cfg:govern.power.wind.gap, @cfg:govern.power.wind.foot),1))'
          op: eq
          value: '@cfg:govern.power.wind.floor_def'
    - any:
      - field: '@cfg:govern.power.wind.suppress'
        op: ne
        value: grow
      - all:
        - field: '@fn:zone_at(@fn:nth(@fn:wind_path(@fn:pos(@fn:nth(@fn:find_defs(@cfg:govern.power.gen_defs),0)),
            @cfg:govern.power.wind.axis, @cfg:govern.power.wind.half_width, @cfg:govern.power.wind.depth,
            @cfg:govern.power.wind.gap, @cfg:govern.power.wind.foot),0))'
          op: present
        - field: '@fn:zone_at(@fn:nth(@fn:wind_path(@fn:pos(@fn:nth(@fn:find_defs(@cfg:govern.power.gen_defs),0)),
            @cfg:govern.power.wind.axis, @cfg:govern.power.wind.half_width, @cfg:govern.power.wind.depth,
            @cfg:govern.power.wind.gap, @cfg:govern.power.wind.foot),1))'
          op: present
  repeat:
    while:
      any:
      - field: '@fn:count(@fn:wind_obstructions(@cfg:govern.power.gen_defs, @cfg:govern.power.wind.axis,
          @cfg:govern.power.wind.half_width, @cfg:govern.power.wind.depth, @cfg:govern.power.wind.gap,
          @cfg:govern.power.wind.foot, @cfg:govern.power.wind.site_kinds))'
        op: gt
        value: 0
      - all:
        - field: '@cfg:govern.power.wind.suppress'
          op: eq
          value: floor
        - any:
          - field: '@fn:terrain_at(@fn:nth(@fn:wind_path(@fn:pos(@fn:nth(@fn:find_defs(@cfg:govern.power.gen_defs),0)),
              @cfg:govern.power.wind.axis, @cfg:govern.power.wind.half_width, @cfg:govern.power.wind.depth,
              @cfg:govern.power.wind.gap, @cfg:govern.power.wind.foot),0))'
            op: ne
            value: '@cfg:govern.power.wind.floor_def'
          - field: '@fn:terrain_at(@fn:nth(@fn:wind_path(@fn:pos(@fn:nth(@fn:find_defs(@cfg:govern.power.gen_defs),0)),
              @cfg:govern.power.wind.axis, @cfg:govern.power.wind.half_width, @cfg:govern.power.wind.depth,
              @cfg:govern.power.wind.gap, @cfg:govern.power.wind.foot),1))'
            op: ne
            value: '@cfg:govern.power.wind.floor_def'
      - all:
        - field: '@cfg:govern.power.wind.suppress'
          op: eq
          value: grow
        - any:
          - field: '@fn:zone_at(@fn:nth(@fn:wind_path(@fn:pos(@fn:nth(@fn:find_defs(@cfg:govern.power.gen_defs),0)),
              @cfg:govern.power.wind.axis, @cfg:govern.power.wind.half_width, @cfg:govern.power.wind.depth,
              @cfg:govern.power.wind.gap, @cfg:govern.power.wind.foot),0))'
            op: absent
          - field: '@fn:zone_at(@fn:nth(@fn:wind_path(@fn:pos(@fn:nth(@fn:find_defs(@cfg:govern.power.gen_defs),0)),
              @cfg:govern.power.wind.axis, @cfg:govern.power.wind.half_width, @cfg:govern.power.wind.depth,
              @cfg:govern.power.wind.gap, @cfg:govern.power.wind.foot),1))'
            op: absent
  steps:
  - template: clear-vegetation
    cooldown_polls: '@cfg:govern.power.wind.clear_cooldown'
    when:
      field: '@fn:count(@fn:wind_obstructions(@cfg:govern.power.gen_defs, @cfg:govern.power.wind.axis,
        @cfg:govern.power.wind.half_width, @cfg:govern.power.wind.depth, @cfg:govern.power.wind.gap,
        @cfg:govern.power.wind.clear_kinds))'
      op: gt
      value: 0
    params:
      designator: '@cfg:govern.power.wind.clear_designator'
      things: '@fn:ids(@fn:wind_obstructions(@cfg:govern.power.gen_defs, @cfg:govern.power.wind.axis,
        @cfg:govern.power.wind.half_width, @cfg:govern.power.wind.depth, @cfg:govern.power.wind.gap,
        @cfg:govern.power.wind.clear_kinds))'
  - template: lay-floor
    for_each: '@fn:find_defs(@cfg:govern.power.gen_defs)'
    when:
      all:
      - field: '@cfg:govern.power.wind.suppress'
        op: eq
        value: floor
      - field: '@fn:count(@fn:wind_obstructions(@cfg:govern.power.gen_defs, @cfg:govern.power.wind.axis,
          @cfg:govern.power.wind.half_width, @cfg:govern.power.wind.depth, @cfg:govern.power.wind.gap,
          @cfg:govern.power.wind.foot, @cfg:govern.power.wind.site_kinds))'
        op: eq
        value: 0
      - field: '@fn:blueprints(@cfg:govern.power.wind.floor_def)'
        op: eq
        value: 0
      - field: '@fn:terrain_at(@fn:nth(@fn:wind_path(@fn:pos(@var:it), @cfg:govern.power.wind.axis,
          @cfg:govern.power.wind.half_width, @cfg:govern.power.wind.depth, @cfg:govern.power.wind.gap,
          @cfg:govern.power.wind.foot),0))'
        op: ne
        value: '@cfg:govern.power.wind.floor_def'
    params:
      def: '@cfg:govern.power.wind.floor_def'
      rect: '@fn:nth(@fn:wind_path(@fn:pos(@var:it), @cfg:govern.power.wind.axis,
        @cfg:govern.power.wind.half_width, @cfg:govern.power.wind.depth, @cfg:govern.power.wind.gap,
        @cfg:govern.power.wind.foot),0)'
      fill: true
  - template: lay-floor
    for_each: '@fn:find_defs(@cfg:govern.power.gen_defs)'
    when:
      all:
      - field: '@cfg:govern.power.wind.suppress'
        op: eq
        value: floor
      - field: '@fn:count(@fn:wind_obstructions(@cfg:govern.power.gen_defs, @cfg:govern.power.wind.axis,
          @cfg:govern.power.wind.half_width, @cfg:govern.power.wind.depth, @cfg:govern.power.wind.gap,
          @cfg:govern.power.wind.foot, @cfg:govern.power.wind.site_kinds))'
        op: eq
        value: 0
      - field: '@fn:blueprints(@cfg:govern.power.wind.floor_def)'
        op: eq
        value: 0
      - field: '@fn:terrain_at(@fn:nth(@fn:wind_path(@fn:pos(@var:it), @cfg:govern.power.wind.axis,
          @cfg:govern.power.wind.half_width, @cfg:govern.power.wind.depth, @cfg:govern.power.wind.gap,
          @cfg:govern.power.wind.foot),1))'
        op: ne
        value: '@cfg:govern.power.wind.floor_def'
    params:
      def: '@cfg:govern.power.wind.floor_def'
      rect: '@fn:nth(@fn:wind_path(@fn:pos(@var:it), @cfg:govern.power.wind.axis,
        @cfg:govern.power.wind.half_width, @cfg:govern.power.wind.depth, @cfg:govern.power.wind.gap,
        @cfg:govern.power.wind.foot),1)'
      fill: true
  - template: create-growing
    for_each: '@fn:find_defs(@cfg:govern.power.gen_defs)'
    when:
      all:
      - field: '@cfg:govern.power.wind.suppress'
        op: eq
        value: grow
      - field: '@fn:count(@fn:wind_obstructions(@cfg:govern.power.gen_defs, @cfg:govern.power.wind.axis,
          @cfg:govern.power.wind.half_width, @cfg:govern.power.wind.depth, @cfg:govern.power.wind.gap,
          @cfg:govern.power.wind.foot, @cfg:govern.power.wind.site_kinds))'
        op: eq
        value: 0
      - field: '@fn:zone_at(@fn:nth(@fn:wind_path(@fn:pos(@var:it), @cfg:govern.power.wind.axis,
          @cfg:govern.power.wind.half_width, @cfg:govern.power.wind.depth, @cfg:govern.power.wind.gap,
          @cfg:govern.power.wind.foot),0))'
        op: absent
    params:
