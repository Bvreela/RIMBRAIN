      rect: '@fn:nth(@fn:wind_path(@fn:pos(@var:it), @cfg:govern.power.wind.axis,
        @cfg:govern.power.wind.half_width, @cfg:govern.power.wind.depth, @cfg:govern.power.wind.gap,
        @cfg:govern.power.wind.foot),0)'
      plant: '@cfg:govern.power.wind.grow_plant'
  - template: create-growing
    for_each: '@fn:find_defs(@cfg:govern.power.gen_defs)'
    when:
      all:
      - field: '@cfg:govern.power.wind.suppress'
        op: eq
        value: grow
      - field: '@fn:count(@fn:wind_obstructions(@cfg:govern.power.gen_defs, @cfg:govern.power.wind.axis,
          @cfg:govern.power.wind.half_width, @cfg:govern.power.wind.depth, @cfg:govern.power.wind.gap,
