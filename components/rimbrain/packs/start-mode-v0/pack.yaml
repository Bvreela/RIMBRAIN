      rect: '@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.workshop.rect_dx), @fn:add(@var:site.min.1,
        @cfg:govern.workshop.rect_dy), @cfg:govern.workshop.rect_w, @cfg:govern.workshop.rect_h)'
- id: research-bench
  option: research-core-tech
  requires:
  - site
  lease_ticks: 12000
  attempts: 6
  effect:
    field: '@fn:find_def(@fn:first(@cfg:govern.research.bench_defs))'
    op: present
  steps:
  - template: build-one
    when:
      field: '@fn:blueprints(@cfg:govern.research.bench_defs)'
      op: eq
      value: 0
    needs: '@fn:free_cell(@fn:first(@cfg:govern.research.bench_defs), @fn:rect(@fn:add(@var:site.min.0,
      @cfg:start.shelter.room_w, 1), @fn:add(@var:site.min.1, @cfg:start.shelter.room_h,
      1), 5, 4), 0, @fn:stuff(@cfg:start.shelter.stuff_preference))'
    params:
      def: '@fn:first(@cfg:govern.research.bench_defs)'
      at: '@fn:free_cell(@fn:first(@cfg:govern.research.bench_defs), @fn:rect(@fn:add(@var:site.min.0,
        @cfg:start.shelter.room_w, 1), @fn:add(@var:site.min.1, @cfg:start.shelter.room_h,
        1), 5, 4), 0, @fn:stuff(@cfg:start.shelter.stuff_preference))'
      stuff: '@fn:stuff(@cfg:start.shelter.stuff_preference)'
- id: research-progress
  option: research-core-tech
  effect:
    any:
    - field: '@fn:research_current()'
      op: present
    - field: '@fn:research_available()'
      op: empty
  repeat:
    while:
      all:
      - field: '@fn:research_current()'
        op: absent
      - field: '@fn:research_available()'
        op: not_empty
  steps:
  - template: queue-research
    when:
      field: '@fn:research_available()'
      op: not_empty
    params:
      queue: '@cfg:govern.research.queue'
      append: true
  - template: set-research
    optional: true
    when:
      all:
      - field: '@fn:research_current()'
        op: absent
      - field: '@fn:research_available()'
        op: not_empty
    needs: '@fn:first(@fn:research_available())'
    params:
      def: '@fn:first(@fn:research_available())'
- id: mission-offers
  when:
    all:
    - field: '@fn:engaged_hostiles()'
      op: empty
    - field: '@obs:meals_present'
      op: truthy
    - field: '@fn:armed_count()'
      op: gte
      value: 1
  effect:
    field: '@fn:letters(true)'
    op: empty
  repeat:
    while:
      field: '@fn:letters(true)'
      op: not_empty
  steps:
  - template: answer-letter
    for_each:
      from: '@fn:letters(true)'
      where:
        field: '@var:it.choices'
        op: contains_any
        values: '@cfg:govern.missions.accept_choices'
    params:
      id: '@var:it.id'
      action: choose
      choice: '@fn:first(@cfg:govern.missions.accept_choices)'
- id: hunting-pause
  when:
    field: '@obs:stocks.nutrition'
    op: gte
    value: '@cfg:govern.hunt.full_nutrition'
  effect:
    all:
    - field: '@fn:steward_stock(hunting, suspended)'
      op: truthy
    - field: '@fn:steward_stock(hunting_leather, suspended)'
      op: truthy
  steps:
  - template: set-stock-target
    params:
      kind: hunting
      suspended: true
  - template: set-stock-target
    params:
      kind: hunting_leather
      suspended: true
- id: hunting-scarce
  when:
    field: '@obs:stocks.nutrition'
    op: lt
    value: '@cfg:govern.hunt.scarce_nutrition'
  effect:
    field: '@fn:steward_stock(hunting, suspended)'
    op: falsy
  steps:
  - template: set-stock-target
    params:
      kind: hunting
      suspended: false
      target: '@cfg:govern.hunt.meat_target'
  - template: set-stock-target
    params:
      kind: hunting_leather
      suspended: false
      target: '@cfg:govern.hunt.leather_target'
- id: scale-mining
  effect:
    field: '@fn:steward_stock(mining, target)'
    op: gte
    value: '@cfg:govern.mining.target'
  steps:
  - template: set-stock-target
    params:
      kind: mining
      target: '@cfg:govern.mining.target'
- id: expand-housing
  requires:
  - site
  when:
    field: '@fn:bed_demand()'
    op: gt
    value: 0
  lease_ticks: 12000
  attempts: 8
  effect:
    field: '@fn:bed_demand()'
    op: eq
    value: 0
  steps:
  - template: build-layout
    params:
      stop_on_error: false
      ops: '@fn:plan_room(@fn:rect(@var:site.min.0, @fn:sub(@var:site.min.1, @fn:add(@cfg:govern.expansion.footprint.h,
        1)), @cfg:govern.expansion.footprint.w, @cfg:govern.expansion.footprint.h),
        bedroom).ops'
  - template: build-layout
    when:
      field: '@var:last_ok'
      op: truthy
    params:
      stop_on_error: false
      ops: '@fn:plan_room(@fn:rect(@fn:add(@var:site.min.0, @fn:add(@cfg:govern.expansion.footprint.w,
        1)), @fn:sub(@var:site.min.1, @fn:add(@cfg:govern.expansion.footprint.h,
        1)), @cfg:govern.expansion.footprint.w, @cfg:govern.expansion.footprint.h),
        bedroom).ops'
  - template: build-layout
    when:
      field: '@var:last_ok'
      op: truthy
    params:
      stop_on_error: false
      ops: '@fn:plan_room(@fn:rect(@fn:add(@var:site.min.0, @fn:add(@fn:mul(@cfg:govern.expansion.footprint.w,
        2), 2)), @fn:sub(@var:site.min.1, @fn:add(@cfg:govern.expansion.footprint.h,
        1)), @cfg:govern.expansion.footprint.w, @cfg:govern.expansion.footprint.h),
        bedroom).ops'
  - template: build-layout
    when:
      field: '@var:last_ok'
      op: truthy
    params:
      stop_on_error: false
      ops: '@fn:plan_room(@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.expansion.overflow.dx),
        @fn:add(@var:site.min.1, @cfg:govern.expansion.overflow.dy),
        @cfg:govern.expansion.footprint.w, @cfg:govern.expansion.footprint.h),
        bedroom).ops'
- id: private-bedrooms
  option: secure-shelter-and-beds
  requires:
  - site
  when:
    all:
    - field: '@fn:rooms_matching({role: Bedroom, min_impressiveness: 40})'
      op: not_empty
    - field: '@fn:bed_demand()'
      op: gt
      value: 0
  lease_ticks: 12000
  attempts: 8
  effect:
    field: '@fn:bed_demand()'
    op: eq
    value: 0
  steps:
  - template: assign-job
    for_each: '@fn:colonist_ids()'
    when:
      field: '@fn:bed_demand()'
      op: gt
      value: 0
    params:
      pawn: '@var:it'
      job: LayDown
      target: '@fn:rooms_matching({role: Bedroom, min_impressiveness: 40}).0.at'
- id: floor-rooms
  option: maintain-mood-stability
  requires:
  - site
  lease_ticks: 12000
  attempts: 6
  effect:
    all:
    - any:
      - field: '@fn:enclosed_at(@fn:rect(@var:site.min.0, @var:site.min.1, @cfg:start.shelter.room_w,
          @cfg:start.shelter.room_h), @cfg:start.shelter.min_room_cells)'
        op: lt
        value: 1
      - field: '@fn:terrain_at(@fn:rect(@fn:add(@var:site.min.0, 1), @fn:add(@var:site.min.1,
          1), @fn:sub(@cfg:start.shelter.room_w, 2), @fn:sub(@cfg:start.shelter.room_h,
          2)))'
        op: eq
        value: '@cfg:govern.floors.floor_def'
    - any:
      - field: '@fn:enclosed_at(@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.kitchen.rect_dx),
          @fn:add(@var:site.min.1, @cfg:govern.kitchen.rect_dy), @cfg:govern.kitchen.room_w,
          @cfg:govern.kitchen.room_h), @cfg:govern.kitchen.min_room_cells)'
        op: lt
        value: 1
      - field: '@fn:terrain_at(@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.kitchen.rect_dx,
          1), @fn:add(@var:site.min.1, @cfg:govern.kitchen.rect_dy, 1), @fn:sub(@cfg:govern.kitchen.room_w,
          2), @fn:sub(@cfg:govern.kitchen.room_h, 2)))'
        op: eq
        value: '@cfg:govern.floors.floor_def'
    - any:
      - field: '@fn:enclosed_at(@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.dining.rect_dx),
          @fn:add(@var:site.min.1, @cfg:govern.dining.rect_dy), @cfg:govern.dining.room_w,
          @cfg:govern.dining.room_h), @cfg:govern.dining.min_room_cells)'
        op: lt
        value: 1
      - field: '@fn:terrain_at(@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.dining.rect_dx,
          1), @fn:add(@var:site.min.1, @cfg:govern.dining.rect_dy, 1), @fn:sub(@cfg:govern.dining.room_w,
          2), @fn:sub(@cfg:govern.dining.room_h, 2)))'
        op: eq
        value: '@cfg:govern.floors.floor_def'
    - any:
      - field: '@fn:enclosed_at(@fn:rect(@var:site.min.0, @fn:sub(@var:site.min.1,
          @fn:add(@cfg:govern.expansion.room_h, 1)), @cfg:govern.expansion.room_w,
          @cfg:govern.expansion.room_h), @cfg:govern.expansion.min_room_cells)'
        op: lt
        value: 1
      - field: '@fn:terrain_at(@fn:rect(@fn:add(@var:site.min.0, 1), @fn:sub(@var:site.min.1,
          @cfg:govern.expansion.room_h), @fn:sub(@cfg:govern.expansion.room_w, 2),
          @fn:sub(@cfg:govern.expansion.room_h, 2)))'
        op: eq
        value: '@cfg:govern.floors.floor_def'
    - any:
      - field: '@fn:enclosed_at(@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.expansion.room_w,
          1), @fn:sub(@var:site.min.1, @fn:add(@cfg:govern.expansion.room_h, 1)),
          @cfg:govern.expansion.room_w, @cfg:govern.expansion.room_h), @cfg:govern.expansion.min_room_cells)'
        op: lt
        value: 1
      - field: '@fn:terrain_at(@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.expansion.room_w,
          2), @fn:sub(@var:site.min.1, @cfg:govern.expansion.room_h), @fn:sub(@cfg:govern.expansion.room_w,
          2), @fn:sub(@cfg:govern.expansion.room_h, 2)))'
        op: eq
        value: '@cfg:govern.floors.floor_def'
  repeat:
    while:
      any:
      - all:
        - field: '@fn:enclosed_at(@fn:rect(@var:site.min.0, @var:site.min.1, @cfg:start.shelter.room_w,
            @cfg:start.shelter.room_h), @cfg:start.shelter.min_room_cells)'
          op: gte
          value: 1
        - field: '@fn:terrain_at(@fn:rect(@fn:add(@var:site.min.0, 1), @fn:add(@var:site.min.1,
            1), @fn:sub(@cfg:start.shelter.room_w, 2), @fn:sub(@cfg:start.shelter.room_h,
            2)))'
          op: ne
          value: '@cfg:govern.floors.floor_def'
      - all:
        - field: '@fn:enclosed_at(@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.kitchen.rect_dx),
            @fn:add(@var:site.min.1, @cfg:govern.kitchen.rect_dy), @cfg:govern.kitchen.room_w,
            @cfg:govern.kitchen.room_h), @cfg:govern.kitchen.min_room_cells)'
          op: gte
          value: 1
        - field: '@fn:terrain_at(@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.kitchen.rect_dx,
            1), @fn:add(@var:site.min.1, @cfg:govern.kitchen.rect_dy, 1), @fn:sub(@cfg:govern.kitchen.room_w,
            2), @fn:sub(@cfg:govern.kitchen.room_h, 2)))'
          op: ne
          value: '@cfg:govern.floors.floor_def'
      - all:
        - field: '@fn:enclosed_at(@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.dining.rect_dx),
