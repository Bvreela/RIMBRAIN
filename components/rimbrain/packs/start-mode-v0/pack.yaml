        @cfg:govern.power.wind.axis, @cfg:govern.power.wind.half_width, @cfg:govern.power.wind.depth,
        @cfg:govern.power.wind.gap, @cfg:govern.power.wind.foot), @cfg:govern.power.wind.clear_kinds))'
