# combat-defense-v0 — fair-class colony defense pack (feature 019,
# contracts/combat-capability.md v0). The Steward `combat` standing
# order owns tick-level execution (draft -> rally -> hold -> overrun ->
# release); these rules steer its lifecycle and record evidence. The
# pack never calls dev.* and never issues direct attack orders while
# the delegate order is engaged.
schema_version: 1
pack_id: pack.combat-defense-v0
revision: "0.1.0"
policy_version: 1
class: fair
meta:
  pack_id: pack.combat-defense-v0
  revision: "0.1.0"
  class: fair
  description: Delegate-mode colony defense — Steward combat order
    executor steered by pack cfg; evidence-only per-poll records.

capabilities:
  templates:
  - id: order-set
    method: steward.orders.set
    description: Enable/disable a Steward standing order.
    params_schema:
      type: object
      required: [id, enabled]
      properties:
        id: {type: string}
        enabled: {type: boolean}
    require: [id, enabled]
  - id: order-run
    method: steward.orders.run
    description: Force an order pass immediately (breach response).
    params_schema:
      type: object
      required: [id]
      properties:
        id: {type: string}
    require: [id]
  - id: rally-set
    method: steward.orders.rally
    description: Set the combat order's rally rect [x,z,w,h].
    params_schema:
      type: object
      required: [rect]
      properties:
        rect: {type: array, items: {type: integer}}
    require: [rect]
  - id: combat-release
    method: steward.orders.release
    description: Release the combat order — undraft + restore duties.
    params_schema:
      type: object
      required: [id]
      properties:
        id: {type: string}
    require: [id]
  - id: draft-pawn
    method: ui.draft
    description: Draft/undraft a colonist (pack-owned fallback path —
      used only while the delegate order cannot be reached).
    params_schema:
      type: object
      required: [pawn, drafted]
      properties:
        pawn: {type: string}
        drafted: {type: boolean}
    require: [pawn, drafted]
  - id: attack-target
    method: ui.attack
    description: Order a drafted colonist to attack a target (pack-
      owned fallback path only).
    params_schema:
      type: object
      required: [pawn, target]
      properties:
        pawn: {type: string}
        target: {type: string}
        melee: {type: boolean}
    require: [pawn, target]
  - id: strip-pawn
    method: ui.designate
    description: Strip a downed/dead hostile for untainted gear.
    params_schema:
      type: object
      required: [designator, things]
      properties:
        designator: {const: strip}
        things: {type: array, items: {type: string}}
    require: [designator, things]
  - id: rescue
    method: ui.job
    description: Give a pawn the Rescue job on a downed colonist.
    params_schema:
      type: object
      required: [pawn, job, target]
      properties:
        pawn: {type: string}
        job: {const: Rescue}
        target: {type: string}
    require: [pawn, job, target]
  - id: move-pawn
    method: ui.goto
    description: Move a drafted pawn to a cell (rally/kite/retreat).
    params_schema:
      type: object
      required: [pawn, cell]
      properties:
        pawn: {type: string}
        cell: {type: array, items: {type: integer}}
    require: [pawn, cell]
  - id: field-tend
    method: ui.job
    description: Tend a wounded pawn in the field.
    params_schema:
      type: object
      required: [pawn, job, target]
      properties:
        pawn: {type: string}
        job: {const: TendPatient}
        target: {type: string}
    require: [pawn, job, target]
  - id: capture
    method: ui.job
    description: Capture a downed hostile to a free prison bed.
    params_schema:
      type: object
      required: [pawn, job, target]
      properties:
        pawn: {type: string}
        job: {const: Capture}
        target: {type: string}
    require: [pawn, job, target]
  - id: ingest-drug
    method: ui.job
    description: Order a pawn to ingest a drug (combat stim etc.).
    params_schema:
      type: object
      required: [pawn, job, target]
      properties:
        pawn: {type: string}
        job: {const: Ingest}
        target: {type: string}
    require: [pawn, job, target]
  - id: set-area
    method: ui.set_policies
    description: Restrict a pawn to an area (shelter under overmatch).
    params_schema:
      type: object
      required: [pawn, area]
      properties:
        pawn: {type: string}
        area: {type: string}
    require: [pawn, area]

# Fair combat cfg (combat-capability/v0). This is a cfg block, NOT the
# dev-harness script — it carries none of the harness script keys.
combat:
  delegate_order: combat
  rally_anchor: anchor-rally
  engage_radius: 40
  overrun_radius: 5
  near_hostile: 30
  release_ticks: 600
  prolonged_ticks: 36000
  min_health: 30
  relief: {food: 30, rest: 25}
  allow_unarmed: false
  engage_odds_floor: 0.4
  option_weights:
    combat-retreat: 100
    combat-relief: 80
    combat-block: 70
    combat-focus: 60
    combat-chase: 50
    combat-kite: 40
    combat-move: 20
  chase_skill: 6
  power_overrides: {}
  assault_duties: [AssaultColony, PrisonerAssaultColony, Breaching,
                   Sapper, Escort, Kidnap, Steal, HuntEnemiesIndividual,
                   AssaultThing, NestAssault]
  watch_lords: [LordJob_Siege, LordJob_StageThenAssault]
  manhunter_mental: Manhunter

# Delegate lifecycle: arm on any live hostile, place rally on engage,
# force-run on breach, release after a hostile-free window. Evidence is
# append-only decision rows; lifecycle markers ride the snapshot.
rules:
- id: combat-arm
  when:
    field: "@fn:living_hostiles()"
    op: not_empty
  cooldown: {polls: 5}
  try:
  - template: order-set
    when:
      field: "@fn:order_state().enabled"
      op: falsy
    params: {id: combat, enabled: true}
- id: combat-rally-place
  when:
    field: "@fn:engaged_hostiles()"
    op: not_empty
  cooldown: {polls: 60}
  try:
  - template: rally-set
    params: {rect: "@fn:rally_rect()"}
- id: combat-force-run
  when:
    any:
    - field: "@fn:combat_mode()"
      op: eq
      value: overrun
    - field: "@fn:hostiles_in_home()"
      op: not_empty
  cooldown: {polls: 5}
  try:
  - template: order-run
    params: {id: combat}
- id: combat-release
  when:
    all:
    - field: "@fn:ticks_since_hostile()"
      op: gte
      value: "@cfg:combat.release_ticks"
    - field: "@fn:order_state().enabled"
      op: truthy
  cooldown: {polls: 20}
  try:
  - template: combat-release
    params: {id: combat}
- id: combat-shelter-overmatch
  # US3: odds below combat.engage_odds_floor -> pull colonists into the
  # Home area instead of feeding the engagement (fleeing beats losing)
  for_each: colonists
  when:
    all:
    - field: "@fn:engaged_hostiles()"
      op: not_empty
    - field: "@fn:threat_power()"
      op: gt
      value: "@fn:fdiv(@fn:mul(@fn:count(@fn:fighters()), 50), @cfg:combat.engage_odds_floor)"
  cooldown: {polls: 60}
  try:
  - template: set-area
    params: {pawn: "@var:it.id", area: Home}
# US4: post-combat recovery — rescue downed colonists first, field-tend
# the wounded, capture only with free prison capacity, strip once the
# field is clear. All run through the single dispatcher.
- id: combat-rescue-downed
  for_each: casualties
  when:
    field: "@fn:draftable()"
    op: not_empty
  cooldown: {polls: 10}
  try:
  - template: rescue
    needs: "@fn:best('medicine')"
    params: {pawn: "@fn:best('medicine')", job: Rescue,
             target: "@var:it.id"}
- id: combat-field-tend
  for_each: "@fn:pawns_needing_tend()"
  when:
    field: "@fn:hostiles_in_home()"
    op: empty
  cooldown: {polls: 30}
  try:
  - template: field-tend
    needs: "@fn:best('medicine')"
    params: {pawn: "@fn:best('medicine')", job: TendPatient,
             target: "@var:it"}
- id: combat-capture
  for_each: downed_hostiles
  when:
    all:
    - field: "@fn:free_beds('prison')"
      op: gt
      value: 0
    - field: "@fn:hostiles_in_home()"
      op: empty
  cooldown: {polls: 20}
  try:
  - template: capture
    needs: "@fn:first(@fn:draftable())"
    params: {pawn: "@fn:first(@fn:draftable())", job: Capture,
             target: "@var:it.id"}
- id: combat-strip-field
  for_each: downed_hostiles
  when:
    field: "@fn:hostiles_in_home()"
    op: empty
  cooldown: {polls: 40}
  try:
  - template: strip-pawn
    params: {designator: strip, things: ["@var:it.id"]}
- id: combat-evidence
  kind: combat-evidence
  cooldown: {polls: 25}
  when:
    field: "@fn:combat_mode()"
    op: ne
    value: watch

# US2: bounded per-pawn action list (feature 017 machinery, feature 019
# options). Each fighter gets <=20 surgical options; the selector picks
# one; an unreachable/invalid pick resolves to the priority head.
# Options are exceptions — the delegate order stays the base executor.
decide:
  select:
    cadence_polls: 5
    rung: shadow
    pawn_scope:
      # all colonists — hurt pawns aren't draftable yet still need the
      # retreat exception; aggressive options gate on draftable() and
      # every option respects the manual-touch interlock
      for_each: colonists
      options:
      - id: combat-retreat
        label: retreat to safety
        template: move-pawn
        when:
          all:
          - not:
              field: "@fn:touched(@var:it.id)"
              op: truthy
          - any:
            - field: "@fn:outranged_by(@var:it.id)"
              op: truthy
            - field: "@fn:outrun_by(@var:it.id)"
              op: truthy
            - field: "@fn:health_of(@var:it.id)"
              op: lt
              value: "@cfg:combat.min_health"
        needs: "@fn:safe_cell(@var:it.id)"
        params: {pawn: "@var:it.id", cell: "@fn:safe_cell(@var:it.id)"}
        priority: "@cfg:combat.option_weights.combat-retreat"
      - id: combat-relief
        label: stand down for relief
        template: draft-pawn
        when:
          all:
          - not:
              field: "@fn:touched(@var:it.id)"
              op: truthy
          - any:
            - field: "@fn:need_of(@var:it.id, 'rest')"
              op: lt
              value: "@cfg:combat.relief.rest"
            - field: "@fn:need_of(@var:it.id, 'food')"
              op: lt
              value: "@cfg:combat.relief.food"
        params: {pawn: "@var:it.id", drafted: false}
        priority: "@cfg:combat.option_weights.combat-relief"
      - id: combat-focus
        label: focus nearest hostile
        template: attack-target
        when:
          all:
          - field: "@fn:draftable(@var:it.id)"
            op: truthy
          - field: "@fn:engaged_hostiles()"
            op: not_empty
        needs: "@fn:nearest_hostile(@var:it.pos)"
        params: {pawn: "@var:it.id",
                 target: "@fn:nearest_hostile(@var:it.pos)"}
        priority: "@cfg:combat.option_weights.combat-focus"
      - id: combat-kite
        label: kite the threat
        template: move-pawn
        when:
          all:
          - field: "@fn:draftable(@var:it.id)"
            op: truthy
          - field: "@fn:outranges(@var:it.id, @fn:nearest_hostile(@var:it.pos))"
            op: truthy
          - not:
              field: "@fn:outrun_by(@var:it.id)"
              op: truthy
        needs: "@fn:kite_cell(@var:it.id)"
        params: {pawn: "@var:it.id", cell: "@fn:kite_cell(@var:it.id)"}
        priority: "@cfg:combat.option_weights.combat-kite"
      - id: combat-block
        label: block the breach
        template: move-pawn
        when:
          all:
          - field: "@fn:draftable(@var:it.id)"
            op: truthy
          - field: "@fn:combat_mode()"
            op: eq
            value: overrun
          - field: "@fn:enemy_mix().melee"
            op: gt
            value: 0
          - field: "@fn:skill_of(@var:it.id, 'melee')"
            op: gte
            value: "@cfg:combat.chase_skill"
        needs: "@fn:block_cell(@var:it.id)"
        params: {pawn: "@var:it.id", cell: "@fn:block_cell(@var:it.id)"}
        priority: "@cfg:combat.option_weights.combat-block"
      - id: combat-chase
        label: chase the fleeing
        template: attack-target
        when:
          all:
          - field: "@fn:draftable(@var:it.id)"
            op: truthy
          - field: "@fn:skill_of(@var:it.id, 'shooting')"
            op: gte
            value: "@cfg:combat.chase_skill"
          - field: "@fn:ticks_since_hostile()"
            op: lt
            value: "@cfg:combat.release_ticks"
        needs: "@fn:nearest_fleeing(@var:it.pos)"
        params: {pawn: "@var:it.id",
                 target: "@fn:nearest_fleeing(@var:it.pos)"}
        priority: "@cfg:combat.option_weights.combat-chase"
      - id: combat-move
        label: take rally position
        template: move-pawn
        when:
          all:
          - field: "@fn:draftable(@var:it.id)"
            op: truthy
          - field: "@fn:engaged_hostiles()"
            op: not_empty
        needs: "@fn:rally_cell(@var:it.id)"
        params: {pawn: "@var:it.id", cell: "@fn:rally_cell(@var:it.id)"}
        priority: "@cfg:combat.option_weights.combat-move"
