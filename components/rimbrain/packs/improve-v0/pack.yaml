schema_version: 1
pack_id: pack.improve-v0
revision: v0.1
class: fair
templates:
- &id001
  id: noop
  method: game.status
  params_schema:
    type: object
    additionalProperties: true
  description: "sentinel \u2014 the improvement loop makes no game writes"
jobs:
- improve
decision_map: []
emergency: []
improve:
  cadence:
    episodes_per_cycle: 1
    max_iterations: 20
  defect_patterns:
  - id: repeated_refusal
    event_type: action.refused
    group_by: payload.template_id
    min_count: 2
    remediation: fix_template_params
  - id: params_invalid
    event_type: action.refused
    group_by: payload.error.code
    match_value: dispatch.params_invalid
    min_count: 1
    remediation: fix_template_params
  - id: verify_failure
    event_type: task.transition
    group_by: payload.kind
    match_to_state:
    - failed
    - expired
    min_count: 2
    remediation: retune_lease_or_effect
  - id: poor_mood
    event_type: colony.vitals
    where:
      field: payload.mood_min
      op: lt
      value: 30
    group_by: event_type
    min_count: 3
    remediation:
      ops:
      - op: set_cfg
        path: start.cooking.buffer
        value: 6
      - op: append
        path: start.recreation.defs
        value: PokerTable
  - id: extreme_break_risk
    event_type: colony.vitals
    where:
      field: payload.extreme_risk
      op: gte
      value: 1
    group_by: event_type
    min_count: 1
    remediation:
      ops:
      - op: append
        path: start.recreation.defs
        value: BilliardsTable
      - op: set_cfg
        path: start.cooking.buffer
        value: 6
  - id: extreme_break_alert
    event_type: colony.vitals
    where:
      field: payload.alerts
      op: contains
      value: Extreme break risk
    group_by: event_type
    min_count: 1
    remediation:
      ops:
      - op: append
        path: start.recreation.defs
        value: BilliardsTable
      - op: set_cfg
        path: start.cooking.buffer
        value: 6
  - id: mental_break_active
    event_type: colony.vitals
    where:
      field: payload.in_mental_state
      op: gte
      value: 1
    group_by: event_type
    min_count: 1
    remediation:
      ops:
      - op: append
        path: start.recreation.defs
        value: PokerTable
      - op: set_cfg
        path: start.cooking.buffer
        value: 8
  - id: repeat_sickness
    event_type: colony.sickness
    group_by: payload.pawn
    window_ticks: 3600000
    min_count: 2
    remediation:
      ops:
      - op: set_cfg
        path: start.cooking.station_defs
        value:
        - ElectricStove
        - FueledStove
        - Campfire
  - id: disease_outbreak
    event_type: colony.sickness
    group_by: event_type
    window_ticks: 60000
    min_count: 3
    remediation:
      ops:
      - op: set_cfg
        path: start.cooking.station_defs
        value:
        - ElectricStove
        - FueledStove
        - Campfire
  - id: food_poisoning_chronic
    event_type: colony.sickness
    where:
      field: payload.hediff
      op: eq
      value: FoodPoisoning
    group_by: event_type
    window_ticks: 3600000
    min_count: 3
    remediation:
      ops:
      - op: set_cfg
        path: start.cooking.station_defs
        value:
        - ElectricStove
        - FueledStove
        - Campfire
  - id: starving_colonist
    event_type: colony.vitals
    where:
      field: payload.starving
      op: gte
      value: 1
    group_by: event_type
    min_count: 2
    remediation:
      ops:
      - op: set_cfg
        path: start.cooking.buffer
        value: 8
      - op: set_cfg
        path: start.food.zone_w
        value: 9
      - op: set_cfg
        path: start.food.zone_h
        value: 9
  - id: starvation_onset
    event_type: colony.sickness
    where:
      field: payload.hediff
      op: eq
      value: Malnutrition
    group_by: payload.pawn
    window_ticks: 3600000
    min_count: 1
    remediation:
      ops:
      - op: set_cfg
        path: start.cooking.buffer
        value: 8
      - op: set_cfg
        path: start.food.zone_w
        value: 9
      - op: set_cfg
        path: start.food.zone_h
        value: 9
  - id: food_crisis
    event_type: colony.vitals
    where:
      field: payload.food_days
      op: lt
      value: 1.5
    group_by: event_type
    min_count: 2
    remediation:
      ops:
      - op: set_cfg
        path: start.cooking.buffer
        value: 8
      - op: set_cfg
        path: start.food.zone_w
        value: 9
      - op: set_cfg
        path: start.food.zone_h
        value: 9
  - id: temperature_stress
    event_type: colony.sickness
    where:
      field: payload.hediff
      op: in
      value:
      - Hypothermia
      - Heatstroke
    group_by: payload.pawn
    window_ticks: 3600000
    min_count: 1
    remediation:
      ops:
      - op: append
        path: start.arm.armor_defs
        value: Apparel_Parka
      - op: append
        path: start.arm.armor_defs
        value: Apparel_CowboyHat
  - id: multiple_downed
    event_type: colony.vitals
    where:
      field: payload.downed
      op: gte
      value: 2
    group_by: event_type
    min_count: 1
    remediation:
      ops:
      - op: drop_rule
        ids:
        - chase-fleeing
  - id: total_incapacitation
    event_type: colony.vitals
    where:
      field: payload.all_downed
      op: eq
      value: true
    group_by: event_type
    min_count: 1
    remediation:
      ops:
      - op: drop_rule
        ids:
        - chase-fleeing
      - op: set_cfg
        path: start.arm.armor_defs
        value:
        - Apparel_PlateArmor
        - Apparel_FlakJacket
        - Apparel_FlakVest
        - Apparel_Duster
        - Apparel_Jacket
  - id: bleeding_out
    event_type: colony.vitals
    where:
      field: payload.bleeding
      op: gte
      value: 1
    group_by: event_type
    min_count: 2
    remediation:
      ops:
      - op: drop_rule
        ids:
        - chase-fleeing
  - id: untended_wounds
    event_type: colony.vitals
    where:
      field: payload.needs_tending
      op: gte
      value: 1
    group_by: event_type
    min_count: 3
    remediation:
      ops:
      - op: append
        path: start.shelter.bed_defs
        value: HospitalBed
  - id: colonist_death
    event_type: colony.vitals
    where:
      field: payload.dead
      op: gte
      value: 1
    group_by: event_type
    min_count: 1
    remediation:
      ops:
      - op: drop_rule
        ids:
        - chase-fleeing
      - op: set_cfg
        path: start.arm.armor_defs
        value:
        - Apparel_PlateArmor
        - Apparel_FlakJacket
        - Apparel_FlakVest
        - Apparel_Duster
        - Apparel_Jacket
  - id: colonist_death_letter
    event_type: colony.letter
    where:
      field: payload.def
      op: eq
      value: Death
    group_by: event_type
    min_count: 1
    remediation:
      ops:
      - op: drop_rule
        ids:
        - chase-fleeing
  - id: raid_pressure
    event_type: colony.letter
    where:
      field: payload.def
      op: eq
      value: ThreatBig
    group_by: event_type
    window_ticks: 3600000
    min_count: 3
    remediation:
      ops:
      - op: drop_rule
        ids:
        - chase-fleeing
      - op: set_cfg
        path: start.arm.armor_defs
        value:
        - Apparel_PlateArmor
        - Apparel_FlakJacket
        - Apparel_FlakVest
        - Apparel_Duster
        - Apparel_Jacket
  - id: escalating_threat
    event_type: colony.vitals
    where:
      field: payload.threat_points
      op: gt
      value: 400
    group_by: event_type
    min_count: 3
    remediation:
      ops:
      - op: set_cfg
        path: start.arm.armor_defs
        value:
        - Apparel_PlateArmor
        - Apparel_FlakJacket
        - Apparel_FlakVest
        - Apparel_Duster
        - Apparel_Jacket
  - id: fire_rampant
    event_type: colony.vitals
    where:
      field: payload.fires
      op: gte
      value: 5
    group_by: event_type
    min_count: 2
    remediation:
      ops:
      - op: set_cfg
        path: start.shelter.stuff_preference
        value:
        - BlocksGranite
        - BlocksLimestone
        - BlocksSandstone
        - Steel
        - WoodLog
  - id: power_failure
    event_type: colony.vitals
    where:
      field: payload.power_net_w
      op: lt
      value: 0
    group_by: event_type
    min_count: 3
    remediation:
      ops:
      - op: set_cfg
        path: start.cooking.buffer
        value: 8
  - id: medicine_shortage
    event_type: colony.vitals
    where:
      field: payload.medicine
      op: lte
      value: 0
    group_by: event_type
    min_count: 3
    remediation:
      ops:
      - op: set_cfg
        path: start.overflow.reserve_interior
        value:
        - Foods
        - Medicine
        - Weapons
        - Apparel
        - Textiles
  - id: spoilage_pileup
    event_type: colony.vitals
    where:
      field: payload.rotting_outside
      op: gte
      value: 5
    group_by: event_type
    min_count: 2
    remediation:
      ops:
      - op: set_cfg
        path: start.overflow.w
        value: 8
      - op: set_cfg
        path: start.overflow.h
        value: 8
  - id: exhaustion
    event_type: colony.vitals
    where:
      field: payload.exhausted
      op: gte
      value: 1
    group_by: event_type
    min_count: 3
    remediation:
      ops:
      - op: set_cfg
        path: start.shelter.bed_defs
        value:
        - Bed
        - DoubleBed
        - HospitalBed
        - SleepingSpot
        - DoubleSleepingSpot
  - id: recreation_deprivation
    event_type: colony.vitals
    where:
      field: payload.bored
      op: gte
      value: 1
    group_by: event_type
    min_count: 3
    remediation:
      ops:
      - op: append
        path: start.recreation.defs
        value: PokerTable
  - id: starvation_alert
    event_type: colony.vitals
    where:
      field: payload.alerts
      op: contains
      value: Starvation
    group_by: event_type
    min_count: 1
    remediation:
      ops:
      - op: set_cfg
        path: start.cooking.buffer
        value: 8
      - op: set_cfg
        path: start.food.zone_w
        value: 9
      - op: set_cfg
        path: start.food.zone_h
        value: 9
  metrics:
    refusal_rate: 0.4
    verify_failure_rate: 0.3
    task_completion_rate: 0.3
    min_events: 5
  audit_gates:
  - code.suite
  - policy.invariant
  - ux.feed_coverage
  promotion:
    episode_boundary_only: true
    incumbent_wins_ties: true
  day_failure_threshold: 0.8
mutate:
  goals_per_pass: 10
  on_failure: true
  near_failure:
    requeues: 2
    refusals: 3
    blocked_polls: 15
    escalate: true
    defect_patterns: true
  cooldown_polls: 40
  max_passes_per_run: 8
  max_ops: 5
meta:
  pack_id: pack.improve-v0
  revision: v0.1
  class: fair
capabilities:
  templates:
  - *id001
reflexes: []
rules: []
senses:
  universal: {}
  govern: {}
phases: []
standing_goals: []
options: []
decide:
  select:
    role: rimbrain.select
    batch_pawns: true
    fallback: priority_head
    shadow: true
  plan:
    role: rimbrain.plan
    cadence_s: 150
    on_phase_boundary: true
