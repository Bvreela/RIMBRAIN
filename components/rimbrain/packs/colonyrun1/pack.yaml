      @fn:sub(@fn:add(@var:site.min.1, @cfg:govern.blueprints.compound.rect_dy), @cfg:govern.blueprints.compound.hall_depth),
      @cfg:govern.blueprints.compound.entrance_w, @fn:add(@cfg:govern.blueprints.compound.hall_depth, 1)))'
    when:
      field: '@fn:sub(@cfg:govern.defense.trap_count, @fn:add(@fn:count(@fn:find_defs_in(@cfg:govern.defense.trap_defs, @fn:rect(@fn:add(@var:site.min.0,
