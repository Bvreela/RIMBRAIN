        @cfg:govern.blueprints.compound.rect_dy), @cfg:govern.blueprints.compound.hall_depth), @cfg:govern.blueprints.compound.entrance_w,
        @fn:add(@cfg:govern.blueprints.compound.hall_depth, 1)))))'
      op: gt
      value: 0
    needs: '@fn:buildable_at(@fn:first(@cfg:govern.defense.trap_defs), @var:it, @fn:stuff(@cfg:govern.defense.trap_stuff))'
