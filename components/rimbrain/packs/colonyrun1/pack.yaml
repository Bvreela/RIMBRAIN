schema_version: 1
pack_id: pack.colonyrun1
revision: v0
policy_version: 1
class: fair
meta:
  pack_id: pack.colonyrun1
  revision: v0
  class: fair
  derived_from: pack.start-mode-v0
capabilities:
  templates:
  - id: set-anchor
    method: anchor.set
    description: Name the selected site so later steps and evidence can reference it.
    params_schema:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        cell:
          type: array
          items:
            type: integer
          minItems: 2
          maxItems: 2
        rect:
          type: array
          items:
            type: integer
          minItems: 4
          maxItems: 4
    require:
    - name
  - id: create-stockpile
    method: ui.zone
    description: Create the storage zone (stockpile) over/near starting items.
    params_schema:
      type: object
      required:
      - action
      properties:
        action:
          const: create_stockpile
        label:
          type: string
        rect:
          type: array
          items:
            type: integer
          minItems: 4
          maxItems: 4
        cells:
          type: array
          items:
            type: array
            items:
              type: integer
            minItems: 2
            maxItems: 2
        preset:
          type: string
        priority:
          type: string
        plant:
          type: string
    require:
    - action
  - id: create-growing
    method: ui.zone
    description: Create a growing zone for the replenishable food source.
    params_schema:
      type: object
      required:
      - action
      properties:
        action:
          const: create_growing
        label:
          type: string
        rect:
          type: array
          items:
            type: integer
          minItems: 4
          maxItems: 4
        plant:
          type: string
    require:
    - action
  - id: unforbid-items
    method: ui.designate
    description: Unforbid starting items by id.
    params_schema:
      type: object
      required:
      - designator
      - things
      properties:
        designator:
          const: unforbid
        things:
          type: array
          items:
            type: string
    require:
    - designator
    - things
  - id: haul-items
    method: ui.designate
    description: Haul-designate loose items to storage.
    params_schema:
      type: object
      required:
      - designator
      - things
      properties:
        designator:
          const: haul
        things:
          type: array
          items:
            type: string
    require:
    - designator
    - things
  - id: build-layout
    method: ui.build_many
    description: Place the shelter layout (walls outline, doors, furniture) in one call.
    params_schema:
      type: object
      required:
      - ops
      properties:
        ops:
          type: array
          items:
            type: object
        stop_on_error:
          type: boolean
    require:
    - ops
  - id: build-one
    method: ui.build
    description: Place a single blueprint (bed, horseshoes pin, torch).
    params_schema:
      type: object
      required:
      - def
      - at
      properties:
        def:
          type: string
        at:
          type: array
          items:
            type: integer
          minItems: 2
          maxItems: 2
        rot:
          type: string
        stuff:
          type: string
        dry_run:
          type: boolean
    require:
    - def
    - at
  - id: lay-floor
    method: ui.build
    description: Fill a rect with a floor terrain def (e.g. WoodFloor) — wind-path regrowth suppression and general flooring.
    params_schema:
      type: object
      required:
      - def
      - rect
      properties:
        def:
          type: string
        rect:
          type: array
          items:
            type: integer
          minItems: 4
          maxItems: 4
        fill:
          const: true
    require:
    - def
    - rect
  - id: clear-vegetation
    method: ui.designate
    description: Chop/harvest plants by thing id, cells, or rect — wind-path clearing and general vegetation control.
    params_schema:
      type: object
      required:
      - designator
      properties:
        designator:
          enum:
          - cut
          - harvest
        things:
          type: array
          items:
            type: string
        cells:
          type: array
          items:
            type: array
            items:
              type: integer
            minItems: 2
            maxItems: 2
        rect:
          type: array
          items:
            type: integer
          minItems: 4
          maxItems: 4
    require:
    - designator
  - id: add-bill
    method: ui.add_bill
    description: Add a recipe bill to a work station (cook meals).
    params_schema:
      type: object
      required:
      - thing
      - recipe
      properties:
        thing:
          type: string
        recipe:
          type: string
        mode:
          enum:
          - RepeatCount
          - TargetCount
          - Forever
        count:
          type: integer
        radius:
          type: integer
    require:
    - thing
    - recipe
  - id: equip-pawn
    method: ui.job
    description: Equip a weapon on a pawn (job=Equip, target=weapon thing id).
    params_schema:
      type: object
      required:
      - pawn
      - job
      - target
      properties:
        pawn:
          type: string
        job:
          const: Equip
        target:
          type: string
    require:
    - pawn
    - job
    - target
  - id: wear-apparel
    method: ui.job
    description: Force-wear apparel on a pawn (job=Wear, target=apparel id).
    params_schema:
      type: object
      required:
      - pawn
      - job
      - target
      properties:
        pawn:
          type: string
        job:
          const: Wear
        target:
          type: string
    require:
    - pawn
    - job
    - target
  - id: assign-job
    method: ui.job
    description: Give an idle pawn a specific job (idle-correction fallback).
    params_schema:
      type: object
      required:
      - pawn
      - job
      properties:
        pawn:
          type: string
        job:
          type: string
        target: {}
        target_b: {}
        count:
          type: integer
        queue:
          type: boolean
    require:
    - pawn
    - job
  - id: strip-pawn
    method: ui.designate
    description: Strip a downed/dead hostile for untainted apparel and gear.
    params_schema:
      type: object
      required:
      - designator
      - things
      properties:
        designator:
          const: strip
        things:
          type: array
          items:
            type: string
    require:
    - designator
    - things
  - id: set-plant
    method: ui.zone
    description: Set the crop on a growing zone (e.g. Plant_Rice).
    params_schema:
      type: object
      required:
      - action
      - label
      - plant
      properties:
        action:
          const: set_plant
        label:
          type: string
        plant:
          type: string
    require:
    - action
    - label
    - plant
  - id: edit-storage
    method: ui.storage
    description: Edit a stockpile's filters/priority (reserve interior for food/medicine).
    params_schema:
      type: object
      properties:
        zone:
          type: string
        thing:
          type: string
        priority:
          enum:
          - Low
          - Normal
          - Preferred
          - Important
          - Critical
        allow_all:
          type: boolean
        disallow_all:
          type: boolean
        allow:
          type: array
          items:
            type: string
        disallow:
          type: array
          items:
            type: string
    require:
    - zone
  - id: save-game
    method: game.save
    description: Save the current game under a checkpoint name (cycle/test control).
    params_schema:
      type: object
      required:
      - name
      properties:
        name:
          type: string
    require:
    - name
  - id: load-game
    method: game.load
    description: Load a saved game (async; caller polls game.status until playing).
    params_schema:
      type: object
      required:
      - name
      properties:
        name:
          type: string
    require:
    - name
  - id: set-research
    method: ui.set_research
    description: Set the current research project by def name (tech-tree progression).
    params_schema:
      type: object
      required:
      - def
      properties:
        def:
          type: string
    require:
    - def
  - id: queue-research
    method: steward.research
    description: Push the pack's ordered research queue; the next startable project becomes current when one finishes.
    params_schema:
      type: object
      properties:
        queue:
          type: array
          items:
            type: string
        append:
          type: boolean
        clear:
          type: boolean
    require: []
  - id: set-stock-target
    method: steward.stock.set
    description: Tune a steward stock job (target/suspend) — throttle hunting, scale mining; the steward's designations follow.
    params_schema:
      type: object
      required:
      - kind
      properties:
        kind:
          type: string
        target:
          type: integer
        suspended:
          type: boolean
    require:
    - kind
  - id: run-stock-job
    method: steward.stock.run
    description: 'Run a steward stock job designation pass now — ignores its interval (idle filler: mining, forestry).'
    params_schema:
      type: object
      required:
      - kind
      properties:
        kind:
          type: string
    require:
    - kind
  - id: answer-letter
    method: ui.letter
    description: Respond to a letter that has choices — mission offers, events (choose/dismiss by label or index).
    params_schema:
      type: object
      required:
      - id
      - action
      properties:
        id: {}
        action:
          enum:
          - choose
          - dismiss
        choice: {}
    require:
    - id
    - action
  - id: draft-pawn
    method: ui.draft
    description: Draft/undraft a colonist for combat defense.
    params_schema:
      type: object
      required:
      - pawn
      - drafted
      properties:
        pawn:
          type: string
        drafted:
          type: boolean
    require:
    - pawn
    - drafted
  - id: attack-target
    method: ui.attack
    description: Order a drafted colonist to attack a hostile target.
    params_schema:
      type: object
      required:
      - pawn
      - target
      properties:
        pawn:
          type: string
        target:
          type: string
        melee:
          type: boolean
    require:
    - pawn
    - target
  - id: answer-dialog
    method: ui.dialog
    description: Answer an open modal window (naming, message, ritual, trade).
    params_schema:
      type: object
      properties:
        i:
          type: integer
        choice: {}
        name:
          type: string
        second_name:
          type: string
        assign:
          type: object
        trade:
          type: object
        method:
          type: string
        action:
          type: string
        set:
          type: object
        close:
          type: boolean
  - id: roof-rect
    method: ui.designate
    description: Roof designation over a rect (Designator_AreaBuildRoof classname).
    params_schema:
      type: object
      required:
      - designator
      - rect
      properties:
        designator:
          const: Designator_AreaBuildRoof
        rect:
          type: array
          items:
            type: integer
          minItems: 4
          maxItems: 4
    require:
    - designator
    - rect
  - id: rescue
    method: ui.job
    description: Give a pawn the Rescue job on a downed colonist.
    params_schema:
      type: object
      required:
      - pawn
      - job
      - target
      properties:
        pawn:
          type: string
        job:
          const: Rescue
        target:
          type: string
    require:
    - pawn
    - job
    - target
  - id: firefight
    method: ui.job
    description: Give a pawn the Firefight job at a map cell.
    params_schema:
      type: object
      required:
      - pawn
      - job
      - target
      properties:
        pawn:
          type: string
        job:
          const: Firefight
        target:
          type: array
          items:
            type: integer
          minItems: 2
          maxItems: 2
    require:
    - pawn
    - job
    - target
  - id: order-set
    method: steward.orders.set
    description: Enable/disable a Steward standing order.
    params_schema:
      type: object
      required:
      - id
      - enabled
      properties:
        id:
          type: string
        enabled:
          type: boolean
    require:
    - id
    - enabled
  - id: order-run
    method: steward.orders.run
    description: Force an order pass immediately (breach response).
    params_schema:
      type: object
      required:
      - id
      properties:
        id:
          type: string
    require:
    - id
  - id: rally-set
    method: steward.orders.rally
    description: Set the combat order's rally rect [x,z,w,h].
    params_schema:
      type: object
      required:
      - rect
      properties:
        rect:
          type: array
          items:
            type: integer
    require:
    - rect
  - id: combat-release
    method: steward.orders.set
    description: Release the combat order — disable it; the mod undrafts + restores duties first when the order is engaged.
    params_schema:
      type: object
      required:
      - id
      properties:
        id:
          type: string
        enabled:
          type: boolean
    require:
    - id
  - id: move-pawn
    method: ui.goto
    description: Move a drafted pawn to a cell (rally/kite/retreat).
    params_schema:
      type: object
      required:
      - pawn
      - cell
      properties:
        pawn:
          type: string
        cell:
          type: array
          items:
            type: integer
    require:
    - pawn
    - cell
  - id: field-tend
    method: ui.job
    description: Tend a wounded pawn in the field.
    params_schema:
      type: object
      required:
      - pawn
      - job
      - target
      properties:
        pawn:
          type: string
        job:
          const: TendPatient
        target:
          type: string
    require:
    - pawn
    - job
    - target
  - id: capture
    method: ui.job
    description: Capture a downed hostile to a free prison bed.
    params_schema:
      type: object
      required:
      - pawn
      - job
      - target
      properties:
        pawn:
          type: string
        job:
          const: Capture
        target:
          type: string
    require:
    - pawn
    - job
    - target
  - id: ingest-drug
    method: ui.job
    description: Order a pawn to ingest a drug (combat stim etc.).
    params_schema:
      type: object
      required:
      - pawn
      - job
      - target
      properties:
        pawn:
          type: string
        job:
          const: Ingest
        target:
          type: string
    require:
    - pawn
    - job
    - target
  - id: set-area
    method: ui.set_policies
    description: Restrict a pawn to an area (shelter under overmatch).
    params_schema:
      type: object
      required:
      - pawn
      - area
      properties:
        pawn:
          type: string
        area:
          type: string
    require:
    - pawn
    - area
reflexes:
- id: colonist-downed
  priority: 1
  when:
    combinator: any
    predicates:
    - field: colonists.downed
      op: gte
      value: 1
  action:
    template_id: rescue
    params:
      pawn: '{state.first_colonist}'
      job: Rescue
      target: '{state.colonists.downed_id}'
- id: fire-active
  priority: 2
  when:
    combinator: any
    predicates:
    - field: map.fires
      op: gte
      value: 1
  action:
    template_id: firefight
    params:
      pawn: '{state.first_colonist}'
      job: Firefight
      target: '{state.map.fire_cell}'
rules:
- id: idle-work
  for_each: colonists
  when:
    all:
    - field: '@var:it.job'
      op: contains_any
      values: '@cfg:universal.idle_patterns'
    - field: '@var:it.drafted'
      op: falsy
  cooldown:
    polls: 20
  try:
  - template: assign-job
    needs: '@fn:loose_id()'
    when:
      field: '@obs:zone_count'
      op: gt
      value: 0
    params:
      pawn: '@var:it.id'
      job: HaulToCell
      target: '@fn:loose_id()'
      target_b: '@var:site.min'
      count: '@fn:stack_of(@fn:loose_id())'
  - template: assign-job
    needs: '@fn:find_kind(tree, 60)'
    when:
      field: '@fn:blueprints_pending()'
      op: eq
      value: 0
    params:
      pawn: '@var:it.id'
      job: CutPlant
      target: '@fn:find_kind(tree, 60)'
  - template: assign-job
    needs: '@fn:find_kind(resource_rock, 60)'
    when:
      field: '@fn:blueprints_pending()'
      op: eq
      value: 0
    params:
      pawn: '@var:it.id'
      job: Mine
      target: '@fn:find_kind(resource_rock, 60)'
  - template: assign-job
    params:
      pawn: '@var:it.id'
      job: LayDown
- id: defend-colony
  for_each: colonists
  when:
    all:
    - field: '@fn:engaged_hostiles()'
      op: not_empty
    - field: '@var:it.weapon'
      op: present
    - field: '@var:it.downed'
      op: falsy
    - not:
        field: '@var:it.job'
        op: contains
        value: ttack
  cooldown:
    polls: 30
  try:
  - template: attack-target
    needs: '@fn:in_range(@var:it.id, @fn:nearest_engaged(@var:it.pos))'
    params:
      pawn: '@var:it.id'
      target: '@fn:nearest_engaged(@var:it.pos)'
  - template: move-pawn
    when:
      field: '@fn:in_range(@var:it.id, @fn:nearest_engaged(@var:it.pos))'
      op: falsy
    needs: '@fn:pos(@fn:nearest_engaged(@var:it.pos))'
    params:
      pawn: '@var:it.id'
      cell: '@fn:pos(@fn:nearest_engaged(@var:it.pos))'
- id: stand-down
  for_each: '@fn:drafted_ids()'
  when:
    field: '@fn:engaged_hostiles()'
    op: empty
  cooldown:
    polls: 30
  try:
  - template: draft-pawn
    params:
      pawn: '@var:it'
      drafted: false
- id: chase-fleeing
  for_each: fleeing_hostiles
  cooldown:
    polls: 40
  try:
  - template: attack-target
    needs: '@fn:best(@cfg:universal.chase_skill)'
    params:
      pawn: '@fn:best(@cfg:universal.chase_skill)'
      target: '@var:it.id'
- id: strip-downed
  cooldown:
    polls: 30
  when:
    field: '@fn:downed_ids()'
    op: not_empty
  try:
  - template: strip-pawn
    params:
      designator: strip
      things: '@fn:downed_ids()'
- id: answer-naming
  for_each: '@fn:dialogs()'
  when:
    field: '@var:it.kind'
    op: eq
    value: give_name
  try:
  - template: answer-dialog
    params:
      i: '@var:it.i'
      choice: OK
- id: dismiss-message
  for_each: '@fn:dialogs()'
  when:
    field: '@var:it.type'
    op: eq
    value: Dialog_MessageBox
  try:
  - template: answer-dialog
    params:
      i: '@var:it.i'
      choice: OK
- id: rescue-stranded
  for_each: '@fn:rescuees()'
  when:
    field: '@fn:engaged_hostiles()'
    op: empty
  cooldown:
    polls: 10
  try:
  - template: rescue
    needs: '@fn:first(@fn:carriers())'
    params:
      pawn: '@fn:first(@fn:carriers())'
      job: Rescue
      target: '@var:it.id'
- id: combat-arm
  when:
    all:
    - field: '@fn:engaged_hostiles()'
      op: not_empty
    - field: '@cfg:combat.direct_command'
      op: falsy
  cooldown:
    polls: 5
  try:
  - template: order-set
    when:
      field: '@fn:order_state().enabled'
      op: falsy
    params:
      id: combat
      enabled: true
- id: combat-rally-place
  when:
    all:
    - field: '@fn:engaged_hostiles()'
      op: not_empty
    - field: '@cfg:combat.direct_command'
      op: falsy
  cooldown:
    polls: 60
  try:
  - template: rally-set
    params:
      rect: '@fn:rally_rect()'
- id: combat-force-run
  when:
    all:
    - any:
      - field: '@fn:combat_mode()'
        op: eq
        value: overrun
      - field: '@fn:hostiles_in_home()'
        op: not_empty
    - field: '@cfg:combat.direct_command'
      op: falsy
  cooldown:
    polls: 5
  try:
  - template: order-run
    params:
      id: combat
- id: combat-release
  when:
    all:
    - field: '@fn:hostile_free_polls()'
      op: gte
      value: '@cfg:combat.release_polls'
    - field: '@fn:ticks_since_hostile()'
      op: gte
      value: '@cfg:combat.release_ticks'
    - field: '@fn:order_state().enabled'
      op: truthy
    - field: '@cfg:combat.direct_command'
      op: falsy
  cooldown:
    polls: 20
  try:
  - template: combat-release
    params:
      id: combat
      enabled: false
- id: combat-order-off
  when:
    all:
    - field: '@cfg:combat.direct_command'
      op: truthy
    - field: '@fn:order_state().enabled'
      op: truthy
  cooldown:
    polls: 30
  try:
  - template: combat-release
    params:
      id: combat
      enabled: false
- id: combat-draft-squad
  for_each: draftable
  when:
    all:
    - field: '@cfg:combat.direct_command'
      op: truthy
    - field: '@fn:engaged_hostiles()'
      op: not_empty
    - field: '@fn:armed_ids()'
      op: contains
      value: '@var:it.id'
  cooldown:
    polls: 30
  try:
  - template: draft-pawn
    params:
      pawn: '@var:it.id'
      drafted: true
- id: combat-stand-down
  for_each: colonists
  when:
    all:
    - field: '@cfg:combat.direct_command'
      op: truthy
    - field: '@fn:hostile_free_polls()'
      op: gte
      value: '@cfg:combat.release_polls'
    - field: '@fn:ticks_since_hostile()'
      op: gte
      value: '@cfg:combat.release_ticks'
  cooldown:
    polls: 20
  try:
  - template: draft-pawn
    params:
      pawn: '@var:it.id'
      drafted: false
- id: combat-shelter-overmatch
  for_each: colonists
  when:
    all:
    - field: '@fn:engaged_hostiles()'
      op: not_empty
    - field: '@fn:threat_power()'
      op: gt
      value: '@fn:fdiv(@fn:mul(@fn:count(@fn:fighters()), 50), @cfg:combat.engage_odds_floor)'
  cooldown:
    polls: 60
  try:
  - template: set-area
    params:
      pawn: '@var:it.id'
      area: Home
- id: combat-rescue-downed
  for_each: casualties
  when:
    field: '@fn:draftable()'
    op: not_empty
  cooldown:
    polls: 10
  try:
  - template: rescue
    needs: '@fn:best(''medicine'')'
    params:
      pawn: '@fn:best(''medicine'')'
      job: Rescue
      target: '@var:it.id'
- id: combat-field-tend
  for_each: '@fn:pawns_needing_tend()'
  when:
    field: '@fn:hostiles_in_home()'
    op: empty
  cooldown:
    polls: 30
  try:
  - template: field-tend
    needs: '@fn:best(''medicine'')'
    params:
      pawn: '@fn:best(''medicine'')'
      job: TendPatient
      target: '@var:it'
- id: combat-capture
  for_each: downed_hostiles
  when:
    all:
    - field: '@fn:free_beds(''prison'')'
      op: gt
      value: 0
    - field: '@fn:hostiles_in_home()'
      op: empty
  cooldown:
    polls: 20
  try:
  - template: capture
    needs: '@fn:first(@fn:draftable())'
    params:
      pawn: '@fn:first(@fn:draftable())'
      job: Capture
      target: '@var:it.id'
- id: combat-strip-field
  for_each: downed_hostiles
  when:
    field: '@fn:hostiles_in_home()'
    op: empty
  cooldown:
    polls: 40
  try:
  - template: strip-pawn
    params:
      designator: strip
      things:
      - '@var:it.id'
- id: combat-evidence
  kind: combat-evidence
  cooldown:
    polls: 25
  when:
    field: '@fn:combat_mode()'
    op: ne
    value: watch
phases:
- id: init
  prescriptive: true
  steps:
  - id: site
    adopt:
      site:
        from_anchor: '@cfg:start.site.anchor_name'
    set:
      site: '@fn:rank_site(@cfg:start.site.zone_w, @cfg:start.site.zone_h, @cfg:start.site.weights.items_proximity, @cfg:start.site.weights.home_proximity,
        @cfg:start.site.weights.fertility, @cfg:start.site.fertile_step, @cfg:start.site.weights.walls, @cfg:start.site.wall_margin,
        @cfg:start.site.wall_defs)'
    resources:
    - site:anchor
    effect:
      field: '@fn:anchor(@cfg:start.site.anchor_name)'
      op: present
    steps:
    - template: set-anchor
      when:
        field: '@var:site.min'
        op: present
      params:
        name: '@cfg:start.site.anchor_name'
        cell: '@var:site.min'
        rect: '@var:site.rect'
  - id: zone
    requires:
    - site
    effect:
      field: '@obs:zone_count'
      op: gte
      value: 1
    steps:
    - template: create-stockpile
      params:
        action: create_stockpile
        label: '@cfg:start.site.anchor_name'
        rect: '@var:site.rect'
  - id: unforbid
    effect:
      field: '@fn:forbidden_ids()'
      op: empty
    steps:
    - template: unforbid-items
      when:
        field: '@fn:forbidden_ids()'
        op: not_empty
      params:
        designator: unforbid
        things: '@fn:forbidden_ids()'
  - id: arm
    lease_ticks: 6000
    attempts: 6
    need: '@fn:min(@obs:colonists.count, @fn:weapons_avail(@cfg:start.arm.weapon_kinds))'
    effect:
      field: '@fn:armed_count()'
      op: gte
      value: '@var:need'
    repeat:
      while:
        field: '@fn:arm_pending(@cfg:start.arm.weapon_kinds, @cfg:start.arm.armor_defs)'
        op: truthy
    escalate:
      after_attempts: 2
      steps:
      - template: unforbid-items
        when:
          field: '@fn:forbidden_ids()'
          op: not_empty
        params:
          designator: unforbid
          things: '@fn:forbidden_ids()'
      - template: strip-pawn
        when:
          field: '@fn:downed_ids()'
          op: not_empty
        params:
          designator: strip
          things: '@fn:downed_ids()'
    steps:
    - template: equip-pawn
      cooldown_polls: 60
      needs: '@fn:arm_weapon(@cfg:start.arm.weapon_kinds)'
      params:
        pawn: '@fn:arm_pawn(@cfg:start.arm.weapon_kinds)'
        job: Equip
        target: '@fn:arm_weapon(@cfg:start.arm.weapon_kinds)'
    - template: wear-apparel
      cooldown_polls: 60
      needs: '@fn:first(@fn:armor_ids(@cfg:start.arm.armor_defs))'
      params:
        pawn: '@fn:best(@cfg:start.arm.armored_skill)'
        job: Wear
        target: '@fn:first(@fn:armor_ids(@cfg:start.arm.armor_defs))'
  - id: shelter
    requires:
    - site
    lease_ticks: 12000
    attempts: 8
    effect:
      any:
      - field: '@fn:rooms_matching({role: Barracks})'
        op: not_empty
      - field: '@fn:rooms_matching({role: Bedroom, min_impressiveness: 40})'
        op: not_empty
    escalate:
      after_attempts: 3
      steps:
      - template: clear-vegetation
        when:
          field: '@fn:count(@fn:obstructions(@fn:rect(@fn:sub(@var:site.min.0, 1), @fn:sub(@var:site.min.1, 1), @fn:add(@cfg:start.shelter.room_w,
            2), @fn:add(@cfg:start.shelter.room_h, 2)), [tree, harvestable]))'
          op: gt
          value: 0
        params:
          designator: cut
          things: '@fn:ids(@fn:obstructions(@fn:rect(@fn:sub(@var:site.min.0, 1), @fn:sub(@var:site.min.1, 1), @fn:add(@cfg:start.shelter.room_w,
            2), @fn:add(@cfg:start.shelter.room_h, 2)), [tree, harvestable]))'
      - template: build-layout
        needs: '@fn:plan_room(@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.expansion.overflow.dx), @fn:add(@var:site.min.1, @cfg:govern.expansion.overflow.dy), @cfg:start.shelter.room_w, @cfg:start.shelter.room_h), barracks)'
        when:
          field: '@fn:enclosed_at(@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.expansion.overflow.dx), @fn:add(@var:site.min.1, @cfg:govern.expansion.overflow.dy),
            @cfg:start.shelter.room_w, @cfg:start.shelter.room_h), @cfg:start.shelter.min_room_cells)'
          op: lt
          value: 1
        params:
          stop_on_error: false
          ops: '@fn:plan_room(@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.expansion.overflow.dx), @fn:add(@var:site.min.1, @cfg:govern.expansion.overflow.dy),
            @cfg:start.shelter.room_w, @cfg:start.shelter.room_h), barracks).ops'
      - template: roof-rect
        when:
          field: '@var:last_ok'
          op: truthy
        params:
          designator: Designator_AreaBuildRoof
          rect: '@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.expansion.overflow.dx), @fn:add(@var:site.min.1, @cfg:govern.expansion.overflow.dy),
            @cfg:start.shelter.room_w, @cfg:start.shelter.room_h)'
    steps:
    - template: build-layout
      needs: '@fn:plan_room(@var:site.rect, barracks)'
      params:
        stop_on_error: false
        ops: '@fn:plan_room(@var:site.rect, barracks).ops'
    - template: roof-rect
      when:
        field: '@var:last_ok'
        op: truthy
      params:
        designator: Designator_AreaBuildRoof
        rect: '@fn:rect(@var:site.min.0, @var:site.min.1, @cfg:govern.expansion.footprint.w, @cfg:govern.expansion.footprint.h)'
  - id: butcher
    requires:
    - site
    lease_ticks: 8000
    attempts: 4
    effect:
      field: '@fn:find_defs(@cfg:start.butcher.defs)'
      op: not_empty
    escalate:
      after_attempts: 2
      steps:
      - template: build-one
        needs: '@fn:free_cell(@fn:first_def(@cfg:start.butcher.defs), @var:site.rect, 0)'
        params:
          def: '@fn:first_def(@cfg:start.butcher.defs)'
          at: '@fn:free_cell(@fn:first_def(@cfg:start.butcher.defs), @var:site.rect, 0)'
    steps:
    - template: build-one
      needs: '@fn:free_cell(@fn:first_def(@cfg:start.butcher.defs), @fn:rect(@fn:add(@var:site.min.0, @fn:sub(@fn:fdiv(@var:site.rect.2, 2), 1)), @fn:add(@var:site.min.1, @fn:sub(@fn:fdiv(@var:site.rect.3, 2), 1)), 3, 3), 0)'
      params:
        def: '@fn:first_def(@cfg:start.butcher.defs)'
        at: '@fn:free_cell(@fn:first_def(@cfg:start.butcher.defs), @fn:rect(@fn:add(@var:site.min.0, @fn:sub(@fn:fdiv(@var:site.rect.2, 2), 1)), @fn:add(@var:site.min.1, @fn:sub(@fn:fdiv(@var:site.rect.3, 2), 1)), 3, 3), 0)'
  - id: storage
    requires:
    - site
    lease_ticks: 12000
    attempts: 8
    effect:
      all:
      - field: '@fn:zone_named(@cfg:start.overflow.label)'
        op: truthy
      - field: '@fn:roofed(@fn:cell(@var:site.min.0, @fn:add(@var:site.min.1, @cfg:start.shelter.room_h, 1)))'
        op: truthy
    escalate:
      after_attempts: 2
      steps:
      - template: create-stockpile
        when:
          field: '@fn:zone_named(@cfg:start.overflow.label)'
          op: falsy
        params:
          action: create_stockpile
          label: '@cfg:start.overflow.label'
          rect: '@fn:rect(@fn:sub(@var:site.min.0, @cfg:start.overflow.w, 1), @fn:add(@var:site.min.1, @cfg:start.shelter.room_h,
            1), @cfg:start.overflow.w, @cfg:start.overflow.h)'
      - template: roof-rect
        when:
          field: '@var:last_ok'
          op: truthy
        params:
          designator: Designator_AreaBuildRoof
          rect: '@fn:rect(@fn:sub(@var:site.min.0, @cfg:start.overflow.w, 1), @fn:add(@var:site.min.1, @cfg:start.shelter.room_h,
            1), @cfg:start.overflow.w, @cfg:start.overflow.h)'
      - template: edit-storage
        when:
          field: '@var:last_ok'
          op: truthy
        params:
          zone: '@cfg:start.overflow.label'
          disallow: '@cfg:start.overflow.reserve_interior'
    steps:
    - template: create-stockpile
      when:
        field: '@fn:zone_named(@cfg:start.overflow.label)'
        op: falsy
      params:
        action: create_stockpile
        label: '@cfg:start.overflow.label'
        rect: '@fn:rect(@var:site.min.0, @fn:add(@var:site.min.1, @cfg:start.shelter.room_h, 1), @cfg:start.overflow.w, @cfg:start.overflow.h)'
    - template: roof-rect
      when:
        field: '@var:last_ok'
        op: truthy
      params:
        designator: Designator_AreaBuildRoof
        rect: '@fn:rect(@var:site.min.0, @fn:add(@var:site.min.1, @cfg:start.shelter.room_h, 1), @cfg:start.overflow.w, @cfg:start.overflow.h)'
    - template: roof-rect
      when:
        field: '@fn:zone_named(@cfg:start.overflow.label)'
        op: truthy
      params:
        designator: Designator_AreaBuildRoof
        rect: '@fn:rect(@var:site.min.0, @fn:add(@var:site.min.1, @cfg:start.shelter.room_h, 1), @cfg:start.overflow.w, @cfg:start.overflow.h)'
    - template: edit-storage
      when:
        field: '@var:last_ok'
        op: truthy
      params:
        zone: '@cfg:start.overflow.label'
        disallow: '@cfg:start.overflow.reserve_interior'
  - id: roof
    requires:
    - site
    lease_ticks: 8000
    attempts: 5
    effect:
      field: '@fn:roofed(@var:site.min)'
      op: truthy
    steps:
    - template: roof-rect
      params:
        designator: Designator_AreaBuildRoof
        rect: '@var:site.rect'
  - id: haul
    lease_ticks: 8000
    attempts: 6
    effect:
      field: '@fn:loose_count()'
      op: lte
      value: '@cfg:start.haul.max_loose'
    escalate:
      after_attempts: 2
      steps:
      - template: create-stockpile
        when:
          all:
          - field: '@var:site'
            op: present
          - field: '@fn:zone_named(@cfg:start.overflow.label)'
            op: falsy
        params:
          action: create_stockpile
          label: '@cfg:start.overflow.label'
          rect: '@fn:rect(@var:site.min.0, @fn:add(@var:site.min.1, @cfg:start.shelter.room_h, 1), @cfg:start.overflow.w,
            @cfg:start.overflow.h)'
      - template: roof-rect
        when:
          field: '@var:last_ok'
          op: truthy
        params:
          designator: Designator_AreaBuildRoof
          rect: '@fn:rect(@var:site.min.0, @fn:add(@var:site.min.1, @cfg:start.shelter.room_h, 1), @cfg:start.overflow.w,
            @cfg:start.overflow.h)'
      - template: edit-storage
        when:
          field: '@var:last_ok'
          op: truthy
        params:
          zone: '@cfg:start.overflow.label'
          disallow: '@cfg:start.overflow.reserve_interior'
    steps:
    - template: haul-items
      when:
        field: '@fn:loose_ids()'
        op: not_empty
      params:
        designator: haul
        things: '@fn:loose_ids()'
  - id: beds
    requires:
    - site
    lease_ticks: 12000
    attempts: 8
    need: '@obs:colonists.count'
    effect:
      field: '@obs:beds_total'
      op: gte
      value: '@var:need'
    repeat:
      while:
        field: '@fn:sub(@var:need, @fn:add(@obs:beds_total, @obs:bed_blueprints))'
        op: gt
        value: 0
    escalate:
      after_attempts: 3
      steps:
      - template: build-one
        needs: '@fn:free_cell(@fn:nth(@cfg:start.shelter.bed_defs, 2), @var:site.rect, 1)'
        params:
          def: '@fn:nth(@cfg:start.shelter.bed_defs, 2)'
          at: '@fn:free_cell(@fn:nth(@cfg:start.shelter.bed_defs, 2), @var:site.rect, 1)'
    steps:
    - template: build-one
      needs: '@fn:free_cell(@cfg:start.shelter.bed_def, @var:site.rect, 1, @fn:stuff(@cfg:start.shelter.stuff_preference))'
      params:
        def: '@cfg:start.shelter.bed_def'
        at: '@fn:free_cell(@cfg:start.shelter.bed_def, @var:site.rect, 1, @fn:stuff(@cfg:start.shelter.stuff_preference))'
        stuff: '@fn:stuff(@cfg:start.shelter.stuff_preference)'
  - id: food
    requires:
    - site
    lease_ticks: 6000
    attempts: 5
    effect:
      field: '@obs:food_source_present'
      op: truthy
    repeat:
      while:
        field: '@obs:food_source_present'
        op: falsy
    escalate:
      after_attempts: 3
      steps:
      - template: create-growing
        when:
          field: '@obs:zones_growing'
          op: lt
          value: 2
        params:
          action: create_growing
          label: start.growing
          rect: '@fn:fertile(@fn:rect(@fn:sub(@var:site.min.0, @cfg:start.food.zone_w, 1), @fn:add(@var:site.min.1, @cfg:start.food.zone_h,
            1), @cfg:start.food.zone_w, @cfg:start.food.zone_h), @cfg:start.fertility.sample_step)'
          plant: '@cfg:start.food.plant'
      - template: set-plant
        params:
          action: set_plant
          label: start.growing
          plant: '@cfg:start.food.plant'
    steps:
    - template: create-growing
      when:
        field: '@obs:zones_growing'
        op: eq
        value: 0
      params:
        action: create_growing
        label: start.growing
        rect: '@fn:fertile(@fn:rect(@fn:sub(@var:site.min.0, @cfg:start.food.zone_w, 1), @var:site.min.1, @cfg:start.food.zone_w,
          @cfg:start.food.zone_h), @cfg:start.fertility.sample_step)'
        plant: '@cfg:start.food.plant'
    - template: set-plant
      when:
        any:
        - field: '@obs:zones_growing'
          op: gte
          value: 1
        - field: '@var:last_ok'
          op: truthy
      params:
        action: set_plant
        label: start.growing
        plant: '@cfg:start.food.plant'
  - id: cookstation
    requires:
    - site
    lease_ticks: 8000
    attempts: 6
    effect:
      field: '@obs:cookstation_ready'
      op: truthy
    repeat:
      while:
        field: '@obs:cookstation_ready'
        op: falsy
    escalate:
      after_attempts: 3
      steps:
      - template: build-one
        when:
          all:
          - field: '@obs:cookstation_ids'
            op: empty
          - field: '@fn:blueprints(@cfg:start.cooking.station_defs)'
            op: eq
            value: 0
        needs: '@fn:free_cell(@fn:nth(@cfg:start.cooking.station_defs, 1), @var:site.rect, 0, @fn:stuff(@cfg:start.shelter.stuff_preference))'
        params:
          def: '@fn:nth(@cfg:start.cooking.station_defs, 1)'
          at: '@fn:free_cell(@fn:nth(@cfg:start.cooking.station_defs, 1), @var:site.rect, 0, @fn:stuff(@cfg:start.shelter.stuff_preference))'
          stuff: '@fn:stuff(@cfg:start.shelter.stuff_preference)'
      - template: add-bill
        when:
          all:
          - field: '@obs:cookstation_ids'
            op: not_empty
          - field: '@obs:cookbill_configured'
            op: falsy
        params:
          thing: '@fn:first(@obs:cookstation_ids)'
          recipe: '@cfg:start.cooking.recipe'
          mode: '@cfg:start.cooking.bill_mode'
          count: '@fn:add(@fn:mul(@obs:colonists.count, @cfg:start.cooking.meals_per_day), @cfg:start.cooking.buffer)'
    steps:
    - template: build-one
      when:
        all:
        - field: '@obs:cookstation_ids'
          op: empty
        - field: '@fn:blueprints(@cfg:start.cooking.station_defs)'
          op: eq
          value: 0
      needs: '@fn:free_cell(@fn:first(@cfg:start.cooking.station_defs), @fn:rect(@fn:add(@var:site.min.0, @cfg:start.shelter.room_w,
        1), @fn:add(@var:site.min.1, 1), 3, @fn:sub(@cfg:start.shelter.room_h, 2)), 0, @fn:stuff(@cfg:start.shelter.stuff_preference))'
      params:
        def: '@fn:first(@cfg:start.cooking.station_defs)'
        at: '@fn:free_cell(@fn:first(@cfg:start.cooking.station_defs), @fn:rect(@fn:add(@var:site.min.0, @cfg:start.shelter.room_w,
          1), @fn:add(@var:site.min.1, 1), 3, @fn:sub(@cfg:start.shelter.room_h, 2)), 0, @fn:stuff(@cfg:start.shelter.stuff_preference))'
        stuff: '@fn:stuff(@cfg:start.shelter.stuff_preference)'
    - template: add-bill
      when:
        all:
        - field: '@obs:cookstation_ids'
          op: not_empty
        - field: '@obs:cookbill_configured'
          op: falsy
      params:
        thing: '@fn:first(@obs:cookstation_ids)'
        recipe: '@cfg:start.cooking.recipe'
        mode: '@cfg:start.cooking.bill_mode'
        count: '@fn:add(@fn:mul(@obs:colonists.count, @cfg:start.cooking.meals_per_day), @cfg:start.cooking.buffer)'
  - id: meals
    lease_ticks: 12000
    attempts: 6
    effect:
      field: '@obs:meals_present'
      op: truthy
    steps: []
  - id: recreation
    requires:
    - site
    lease_ticks: 8000
    attempts: 6
    effect:
      field: '@obs:recreation_present'
      op: truthy
    escalate:
      after_attempts: 3
      steps:
      - template: build-one
        when:
          field: '@fn:blueprints(@cfg:start.recreation.defs)'
          op: eq
          value: 0
        needs: '@fn:free_cell(@fn:first(@cfg:start.recreation.defs), @var:site.rect, 0, @fn:stuff(@cfg:start.shelter.stuff_preference))'
        params:
          def: '@fn:first(@cfg:start.recreation.defs)'
          at: '@fn:free_cell(@fn:first(@cfg:start.recreation.defs), @var:site.rect, 0, @fn:stuff(@cfg:start.shelter.stuff_preference))'
          stuff: '@fn:stuff(@cfg:start.shelter.stuff_preference)'
    steps:
    - template: build-one
      when:
        all:
        - field: '@obs:recreation_present'
          op: falsy
        - field: '@fn:blueprints(@cfg:start.recreation.defs)'
          op: eq
          value: 0
      needs: '@fn:free_cell(@fn:first(@cfg:start.recreation.defs), @fn:rect(@fn:add(@var:site.min.0, @cfg:start.shelter.room_w,
        1), @var:site.min.1, 3, @cfg:start.shelter.room_h), 0, @fn:stuff(@cfg:start.shelter.stuff_preference))'
      params:
        def: '@fn:first(@cfg:start.recreation.defs)'
        at: '@fn:free_cell(@fn:first(@cfg:start.recreation.defs), @fn:rect(@fn:add(@var:site.min.0, @cfg:start.shelter.room_w,
          1), @var:site.min.1, 3, @cfg:start.shelter.room_h), 0, @fn:stuff(@cfg:start.shelter.stuff_preference))'
        stuff: '@fn:stuff(@cfg:start.shelter.stuff_preference)'
  - id: dining
    requires:
    - site
    lease_ticks: 12000
    attempts: 8
    effect:
      any:
      - field: '@fn:rooms_matching({role: DiningRoom, min_impressiveness: 40})'
        op: not_empty
      - field: '@fn:rooms_matching({role: RecRoom, min_impressiveness: 40})'
        op: not_empty
    repeat:
      while:
        all:
        - field: '@fn:rooms_matching({role: DiningRoom, min_impressiveness: 40})'
          op: empty
        - field: '@fn:rooms_matching({role: RecRoom, min_impressiveness: 40})'
          op: empty
    escalate:
      after_attempts: 3
      steps:
      - template: clear-vegetation
        when:
          field: '@fn:count(@fn:obstructions(@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.dining.rect_dx, -1), @fn:add(@var:site.min.1,
            @cfg:govern.dining.rect_dy, -1), @fn:add(@cfg:govern.dining.room_w, 2), @fn:add(@cfg:govern.dining.room_h, 2)),
            [tree, harvestable]))'
          op: gt
          value: 0
        params:
          designator: cut
          things: '@fn:ids(@fn:obstructions(@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.dining.rect_dx, -1), @fn:add(@var:site.min.1,
            @cfg:govern.dining.rect_dy, -1), @fn:add(@cfg:govern.dining.room_w, 2), @fn:add(@cfg:govern.dining.room_h, 2)),
            [tree, harvestable]))'
      - template: build-layout
        needs: '@fn:plan_room(@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.dining.alt_dx), @fn:add(@var:site.min.1, @cfg:govern.dining.alt_dy), @cfg:govern.dining.room_w, @cfg:govern.dining.room_h), dining_hall)'
        when:
          field: '@fn:enclosed_at(@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.dining.alt_dx), @fn:add(@var:site.min.1, @cfg:govern.dining.alt_dy),
            @cfg:govern.dining.room_w, @cfg:govern.dining.room_h), @cfg:govern.dining.min_room_cells)'
          op: lt
          value: 1
        params:
          stop_on_error: false
          ops: '@fn:plan_room(@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.dining.alt_dx), @fn:add(@var:site.min.1, @cfg:govern.dining.alt_dy),
            @cfg:govern.dining.room_w, @cfg:govern.dining.room_h), dining_hall).ops'
      - template: roof-rect
        when:
          field: '@var:last_ok'
          op: truthy
        params:
          designator: Designator_AreaBuildRoof
          rect: '@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.dining.alt_dx), @fn:add(@var:site.min.1, @cfg:govern.dining.alt_dy),
            @cfg:govern.dining.room_w, @cfg:govern.dining.room_h)'
    steps:
    - template: build-layout
      needs: '@fn:plan_room(@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.dining.rect_dx), @fn:add(@var:site.min.1, @cfg:govern.dining.rect_dy), @cfg:govern.dining.room_w, @cfg:govern.dining.room_h), dining_hall)'
      params:
        stop_on_error: false
        ops: '@fn:plan_room(@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.dining.rect_dx), @fn:add(@var:site.min.1, @cfg:govern.dining.rect_dy),
          @cfg:govern.dining.room_w, @cfg:govern.dining.room_h), dining_hall).ops'
    - template: roof-rect
      when:
        field: '@var:last_ok'
        op: truthy
      params:
        designator: Designator_AreaBuildRoof
        rect: '@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.dining.rect_dx), @fn:add(@var:site.min.1, @cfg:govern.dining.rect_dy),
          @cfg:govern.dining.room_w, @cfg:govern.dining.room_h)'
  - id: kitchen
    requires:
    - site
    lease_ticks: 12000
    attempts: 8
    effect:
      field: '@fn:rooms_matching({role: Kitchen})'
      op: not_empty
    repeat:
      while:
        field: '@fn:rooms_matching({role: Kitchen})'
        op: empty
    escalate:
      after_attempts: 3
      steps:
      - template: clear-vegetation
        when:
          field: '@fn:count(@fn:obstructions(@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.kitchen.rect_dx, -1), @fn:add(@var:site.min.1,
            @cfg:govern.kitchen.rect_dy, -1), @fn:add(@cfg:govern.kitchen.room_w, 2), @fn:add(@cfg:govern.kitchen.room_h, 2)),
            [tree, harvestable]))'
          op: gt
          value: 0
        params:
          designator: cut
          things: '@fn:ids(@fn:obstructions(@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.kitchen.rect_dx, -1), @fn:add(@var:site.min.1,
            @cfg:govern.kitchen.rect_dy, -1), @fn:add(@cfg:govern.kitchen.room_w, 2), @fn:add(@cfg:govern.kitchen.room_h, 2)),
            [tree, harvestable]))'
      - template: build-layout
        needs: '@fn:plan_room(@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.kitchen.alt_dx), @fn:add(@var:site.min.1, @cfg:govern.kitchen.alt_dy), @cfg:govern.kitchen.room_w, @cfg:govern.kitchen.room_h), kitchen)'
        when:
          field: '@fn:enclosed_at(@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.kitchen.alt_dx), @fn:add(@var:site.min.1, @cfg:govern.kitchen.alt_dy),
            @cfg:govern.kitchen.room_w, @cfg:govern.kitchen.room_h), @cfg:govern.kitchen.min_room_cells)'
          op: lt
          value: 1
        params:
          stop_on_error: false
          ops: '@fn:plan_room(@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.kitchen.alt_dx), @fn:add(@var:site.min.1, @cfg:govern.kitchen.alt_dy),
            @cfg:govern.kitchen.room_w, @cfg:govern.kitchen.room_h), kitchen).ops'
      - template: roof-rect
        when:
          field: '@var:last_ok'
          op: truthy
        params:
          designator: Designator_AreaBuildRoof
          rect: '@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.kitchen.alt_dx), @fn:add(@var:site.min.1, @cfg:govern.kitchen.alt_dy),
            @cfg:govern.kitchen.room_w, @cfg:govern.kitchen.room_h)'
    steps:
    - template: build-layout
      needs: '@fn:plan_room(@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.kitchen.rect_dx), @fn:add(@var:site.min.1, @cfg:govern.kitchen.rect_dy), @cfg:govern.kitchen.room_w, @cfg:govern.kitchen.room_h), kitchen)'
      params:
        stop_on_error: false
        ops: '@fn:plan_room(@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.kitchen.rect_dx), @fn:add(@var:site.min.1, @cfg:govern.kitchen.rect_dy),
          @cfg:govern.kitchen.room_w, @cfg:govern.kitchen.room_h), kitchen).ops'
    - template: roof-rect
      when:
        field: '@var:last_ok'
        op: truthy
      params:
        designator: Designator_AreaBuildRoof
        rect: '@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.kitchen.rect_dx), @fn:add(@var:site.min.1, @cfg:govern.kitchen.rect_dy),
          @cfg:govern.kitchen.room_w, @cfg:govern.kitchen.room_h)'
  - id: dump
    requires:
    - site
    lease_ticks: 4000
    attempts: 4
    effect:
      field: '@fn:zone_named(@cfg:govern.dump.label)'
      op: truthy
    escalate:
      after_attempts: 2
      steps:
      - template: create-stockpile
        when:
          field: '@fn:zone_named(@cfg:govern.dump.label)'
          op: falsy
        params:
          action: create_stockpile
          label: '@cfg:govern.dump.label'
          rect: '@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.dump.alt_dx), @fn:add(@var:site.min.1, @cfg:govern.dump.alt_dy),
            @cfg:govern.dump.w, @cfg:govern.dump.h)'
      - template: edit-storage
        when:
          field: '@var:last_ok'
          op: truthy
        params:
          zone: '@cfg:govern.dump.label'
          disallow_all: true
          allow: '@cfg:govern.dump.allow'
    steps:
    - template: create-stockpile
      when:
        field: '@fn:zone_named(@cfg:govern.dump.label)'
        op: falsy
      params:
        action: create_stockpile
        label: '@cfg:govern.dump.label'
        rect: '@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.dump.rect_dx), @fn:add(@var:site.min.1, @cfg:govern.dump.rect_dy),
          @cfg:govern.dump.w, @cfg:govern.dump.h)'
    - template: edit-storage
      when:
        any:
        - field: '@var:last_ok'
          op: truthy
        - field: '@fn:zone_named(@cfg:govern.dump.label)'
          op: truthy
      params:
        zone: '@cfg:govern.dump.label'
        disallow_all: true
        allow: '@cfg:govern.dump.allow'
  complete:
    conditions:
      shelter:
        any:
        - field: '@fn:rooms_matching({role: Barracks})'
          op: not_empty
        - field: '@fn:rooms_matching({role: Bedroom, min_impressiveness: 40})'
          op: not_empty
      dining:
        any:
        - field: '@fn:rooms_matching({role: DiningRoom, min_impressiveness: 40})'
          op: not_empty
        - field: '@fn:rooms_matching({role: RecRoom, min_impressiveness: 40})'
          op: not_empty
      kitchen:
        field: '@fn:rooms_matching({role: Kitchen})'
        op: not_empty
      beds:
        field: '@obs:beds_total'
        op: gte
        value: '@obs:colonists.count'
      food:
        field: '@obs:food_source_present'
        op: truthy
      meals:
        field: '@obs:meals_present'
        op: truthy
      recreation:
        field: '@obs:recreation_present'
        op: truthy
    fix:
      meals:
      - phase: cookstation
        when:
          field: '@obs:cookstation_ready'
          op: falsy
      - meals
standing_goals:
- id: maintain-storage
  requires:
  - site
  effect:
    field: '@fn:zone_named(@cfg:start.site.anchor_name)'
    op: truthy
  repeat:
    while:
      field: '@fn:zone_named(@cfg:start.site.anchor_name)'
      op: falsy
  steps:
  - template: create-stockpile
    params:
      action: create_stockpile
      label: '@cfg:start.site.anchor_name'
      rect: '@var:site.rect'
- id: maintain-overflow
  requires:
  - site
  when:
    field: '@fn:zone_named(@cfg:start.site.anchor_name)'
    op: truthy
  effect:
    field: '@fn:zone_named(@cfg:start.overflow.label)'
    op: truthy
  repeat:
    while:
      field: '@fn:zone_named(@cfg:start.overflow.label)'
      op: falsy
  steps:
  - template: create-stockpile
    params:
      action: create_stockpile
      label: '@cfg:start.overflow.label'
      rect: '@fn:rect(@var:site.min.0, @fn:add(@var:site.min.1, @cfg:start.shelter.room_h, 1), @cfg:start.overflow.w, @cfg:start.overflow.h)'
  - template: roof-rect
    when:
      field: '@var:last_ok'
      op: truthy
    params:
      designator: Designator_AreaBuildRoof
      rect: '@fn:rect(@var:site.min.0, @fn:add(@var:site.min.1, @cfg:start.shelter.room_h, 1), @cfg:start.overflow.w, @cfg:start.overflow.h)'
  - template: edit-storage
    when:
      field: '@var:last_ok'
      op: truthy
    params:
      zone: '@cfg:start.overflow.label'
      disallow: '@cfg:start.overflow.reserve_interior'
- id: sustained-shelter
  option: secure-shelter-and-beds
  requires:
  - site
  effect:
    field: '@obs:beds_total'
    op: gte
    value: '@obs:colonists.count'
  repeat:
    while:
      field: '@fn:sub(@obs:colonists.count, @fn:add(@obs:beds_total, @obs:bed_blueprints))'
      op: gt
      value: 0
  steps:
  - template: build-one
    needs: '@fn:free_cell(@cfg:start.shelter.bed_def, @var:site.rect, 1, @fn:stuff(@cfg:start.shelter.stuff_preference))'
    params:
      def: '@cfg:start.shelter.bed_def'
      at: '@fn:free_cell(@cfg:start.shelter.bed_def, @var:site.rect, 1, @fn:stuff(@cfg:start.shelter.stuff_preference))'
      stuff: '@fn:stuff(@cfg:start.shelter.stuff_preference)'
- id: food-security
  option: establish-food-security
  requires:
  - site
  effect:
    field: '@obs:meals_present'
    op: truthy
  repeat:
    while:
      field: '@obs:meals_present'
      op: falsy
  steps:
  - template: create-growing
    when:
      field: '@obs:zones_growing'
      op: eq
      value: 0
    params:
      action: create_growing
      label: start.growing
      rect: '@fn:fertile(@fn:rect(@fn:sub(@var:site.min.0, @cfg:start.food.zone_w, 1), @var:site.min.1, @cfg:start.food.zone_w,
        @cfg:start.food.zone_h), @cfg:start.fertility.sample_step)'
      plant: '@cfg:start.food.plant'
  - template: set-plant
    when:
      field: '@obs:zones_growing'
      op: gte
      value: 1
    params:
      action: set_plant
      label: start.growing
      plant: '@cfg:start.food.plant'
  - template: add-bill
    when:
      all:
      - field: '@obs:cookstation_ids'
        op: not_empty
      - field: '@obs:cookbill_configured'
        op: falsy
    params:
      thing: '@fn:first(@obs:cookstation_ids)'
      recipe: '@cfg:start.cooking.recipe'
      mode: '@cfg:start.cooking.bill_mode'
      count: '@fn:add(@fn:mul(@obs:colonists.count, @cfg:start.cooking.meals_per_day), @cfg:start.cooking.buffer)'
- id: arm-every-colonist
  option: arm-every-colonist
  effect:
    field: '@fn:arm_pending(@cfg:start.arm.weapon_kinds, @cfg:start.arm.armor_defs)'
    op: falsy
  repeat:
    while:
      field: '@fn:arm_pending(@cfg:start.arm.weapon_kinds, @cfg:start.arm.armor_defs)'
      op: truthy
  steps:
  - template: equip-pawn
    cooldown_polls: 60
    needs: '@fn:arm_weapon(@cfg:start.arm.weapon_kinds)'
    params:
      pawn: '@fn:arm_pawn(@cfg:start.arm.weapon_kinds)'
      job: Equip
      target: '@fn:arm_weapon(@cfg:start.arm.weapon_kinds)'
  - template: wear-apparel
    cooldown_polls: 60
    needs: '@fn:first(@fn:armor_ids(@cfg:start.arm.armor_defs))'
    params:
      pawn: '@fn:best(@cfg:start.arm.armored_skill)'
      job: Wear
      target: '@fn:first(@fn:armor_ids(@cfg:start.arm.armor_defs))'
- id: review-equipment
  requires:
  - site
  when:
    field: '@fn:mod(@obs:day, @cfg:govern.equipment.review_days)'
    op: eq
    value: 0
  effect:
    field: '@fn:equip_pending(@cfg:start.arm.weapon_kinds, @cfg:start.arm.armored_skill, @cfg:start.arm.armor_defs)'
    op: falsy
  repeat:
    while:
      field: '@fn:equip_pending(@cfg:start.arm.weapon_kinds, @cfg:start.arm.armored_skill, @cfg:start.arm.armor_defs)'
      op: truthy
  steps:
  - template: equip-pawn
    cooldown_polls: 60
    needs: '@fn:upgrade_weapon(@cfg:start.arm.weapon_kinds)'
    params:
      pawn: '@fn:upgrade_pawn(@cfg:start.arm.weapon_kinds)'
      job: Equip
      target: '@fn:upgrade_weapon(@cfg:start.arm.weapon_kinds)'
  - template: wear-apparel
    cooldown_polls: 60
    needs: '@fn:upgrade_armor(@cfg:start.arm.armored_skill, @cfg:start.arm.armor_defs)'
    params:
      pawn: '@fn:upgrade_armor_pawn(@cfg:start.arm.armored_skill, @cfg:start.arm.armor_defs)'
      job: Wear
      target: '@fn:upgrade_armor(@cfg:start.arm.armored_skill, @cfg:start.arm.armor_defs)'
- id: build-chokepoint-defense
  option: build-chokepoint-defense
  requires:
  - site
  lease_ticks: 16000
  attempts: 8
  effect:
    all:
    - field: '@fn:enclosed_at(@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.blueprints.compound.rect_dx), @fn:add(@var:site.min.1,
        @cfg:govern.blueprints.compound.rect_dy), @cfg:govern.blueprints.compound.w, @cfg:govern.blueprints.compound.h), @cfg:govern.blueprints.compound.min_room_cells)'
      op: gte
      value: 1
    - field: '@fn:count(@fn:find_defs_in(@cfg:govern.defense.trap_defs, @fn:rect(@fn:add(@var:site.min.0, @cfg:govern.blueprints.compound.rect_dx,
        @cfg:govern.blueprints.compound.entrance_dx), @fn:sub(@fn:add(@var:site.min.1, @cfg:govern.blueprints.compound.rect_dy),
        @cfg:govern.blueprints.compound.hall_depth), @cfg:govern.blueprints.compound.entrance_w, @fn:add(@cfg:govern.blueprints.compound.hall_depth,
        1))))'
      op: gte
      value: '@cfg:govern.defense.trap_count'
  repeat:
    while:
      any:
      - field: '@fn:enclosed_at(@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.blueprints.compound.rect_dx), @fn:add(@var:site.min.1,
          @cfg:govern.blueprints.compound.rect_dy), @cfg:govern.blueprints.compound.w, @cfg:govern.blueprints.compound.h),
          @cfg:govern.blueprints.compound.min_room_cells)'
        op: lt
        value: 1
      - field: '@fn:sub(@cfg:govern.defense.trap_count, @fn:add(@fn:count(@fn:find_defs_in(@cfg:govern.defense.trap_defs,
          @fn:rect(@fn:add(@var:site.min.0, @cfg:govern.blueprints.compound.rect_dx, @cfg:govern.blueprints.compound.entrance_dx),
          @fn:sub(@fn:add(@var:site.min.1, @cfg:govern.blueprints.compound.rect_dy), @cfg:govern.blueprints.compound.hall_depth),
          @cfg:govern.blueprints.compound.entrance_w, @fn:add(@cfg:govern.blueprints.compound.hall_depth, 1)))), @fn:blueprints_in(@cfg:govern.defense.trap_defs,
          @fn:rect(@fn:add(@var:site.min.0, @cfg:govern.blueprints.compound.rect_dx, @cfg:govern.blueprints.compound.entrance_dx),
          @fn:sub(@fn:add(@var:site.min.1, @cfg:govern.blueprints.compound.rect_dy), @cfg:govern.blueprints.compound.hall_depth),
          @cfg:govern.blueprints.compound.entrance_w, @fn:add(@cfg:govern.blueprints.compound.hall_depth, 1)))))'
        op: gt
        value: 0
  steps:
  - template: build-layout
    cooldown_polls: 60
    when:
      field: '@fn:enclosed_at(@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.blueprints.compound.rect_dx), @fn:add(@var:site.min.1,
        @cfg:govern.blueprints.compound.rect_dy), @cfg:govern.blueprints.compound.w, @cfg:govern.blueprints.compound.h), @cfg:govern.blueprints.compound.min_room_cells)'
      op: lt
      value: 1
    params:
      stop_on_error: false
      ops:
      - def: '@cfg:start.shelter.door_def'
        at: '@fn:cell(@fn:add(@var:site.min.0, @cfg:govern.blueprints.compound.rect_dx, @fn:fdiv(@cfg:govern.blueprints.compound.w,
          2)), @fn:add(@var:site.min.1, @cfg:govern.blueprints.compound.rect_dy, @cfg:govern.blueprints.compound.h, -1))'
        stuff: '@fn:stuff(@cfg:govern.blueprints.compound.door_stuff)'
      - def: '@cfg:start.shelter.door_def'
        at: '@fn:cell(@fn:add(@var:site.min.0, @cfg:govern.blueprints.compound.rect_dx, @fn:fdiv(@cfg:govern.blueprints.compound.entrance_dx,
          2)), @fn:add(@var:site.min.1, @cfg:govern.blueprints.compound.rect_dy))'
        stuff: '@fn:stuff(@cfg:govern.blueprints.compound.door_stuff)'
      - def: '@cfg:start.shelter.door_def'
        at: '@fn:cell(@fn:add(@var:site.min.0, @cfg:govern.blueprints.compound.rect_dx), @fn:add(@var:site.min.1, @cfg:govern.blueprints.compound.rect_dy,
          @fn:fdiv(@cfg:govern.blueprints.compound.h, 2)))'
        stuff: '@fn:stuff(@cfg:govern.blueprints.compound.door_stuff)'
      - def: '@cfg:start.shelter.door_def'
        at: '@fn:cell(@fn:add(@var:site.min.0, @cfg:govern.blueprints.compound.rect_dx, @cfg:govern.blueprints.compound.w,
          -1), @fn:add(@var:site.min.1, @cfg:govern.blueprints.compound.rect_dy, @fn:fdiv(@cfg:govern.blueprints.compound.h,
          2)))'
        stuff: '@fn:stuff(@cfg:govern.blueprints.compound.door_stuff)'
      - def: '@cfg:start.shelter.wall_def'
        rect: '@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.blueprints.compound.rect_dx), @fn:add(@var:site.min.1, @cfg:govern.blueprints.compound.rect_dy),
          @fn:fdiv(@cfg:govern.blueprints.compound.entrance_dx, 2), 1)'
        stuff: '@fn:stuff(@cfg:start.shelter.stuff_preference)'
      - def: '@cfg:start.shelter.wall_def'
        rect: '@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.blueprints.compound.rect_dx, @fn:fdiv(@cfg:govern.blueprints.compound.entrance_dx,
          2), 1), @fn:add(@var:site.min.1, @cfg:govern.blueprints.compound.rect_dy), @fn:sub(@cfg:govern.blueprints.compound.entrance_dx,
          @fn:fdiv(@cfg:govern.blueprints.compound.entrance_dx, 2), 1), 1)'
        stuff: '@fn:stuff(@cfg:start.shelter.stuff_preference)'
      - def: '@cfg:start.shelter.wall_def'
        rect: '@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.blueprints.compound.rect_dx, @cfg:govern.blueprints.compound.entrance_dx,
          @cfg:govern.blueprints.compound.entrance_w), @fn:add(@var:site.min.1, @cfg:govern.blueprints.compound.rect_dy),
          @fn:sub(@cfg:govern.blueprints.compound.w, @cfg:govern.blueprints.compound.entrance_dx, @cfg:govern.blueprints.compound.entrance_w),
          1)'
        stuff: '@fn:stuff(@cfg:start.shelter.stuff_preference)'
      - def: '@cfg:start.shelter.wall_def'
        rect: '@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.blueprints.compound.rect_dx), @fn:add(@var:site.min.1, @cfg:govern.blueprints.compound.rect_dy,
          1), 1, @fn:sub(@fn:fdiv(@cfg:govern.blueprints.compound.h, 2), 1))'
        stuff: '@fn:stuff(@cfg:start.shelter.stuff_preference)'
      - def: '@cfg:start.shelter.wall_def'
        rect: '@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.blueprints.compound.rect_dx), @fn:add(@var:site.min.1, @cfg:govern.blueprints.compound.rect_dy,
          @fn:fdiv(@cfg:govern.blueprints.compound.h, 2), 1), 1, @fn:sub(@cfg:govern.blueprints.compound.h, @fn:fdiv(@cfg:govern.blueprints.compound.h,
          2), 1))'
        stuff: '@fn:stuff(@cfg:start.shelter.stuff_preference)'
      - def: '@cfg:start.shelter.wall_def'
        rect: '@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.blueprints.compound.rect_dx), @fn:add(@var:site.min.1, @cfg:govern.blueprints.compound.rect_dy,
          @cfg:govern.blueprints.compound.h, -1), @fn:fdiv(@cfg:govern.blueprints.compound.w, 2), 1)'
        stuff: '@fn:stuff(@cfg:start.shelter.stuff_preference)'
      - def: '@cfg:start.shelter.wall_def'
        rect: '@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.blueprints.compound.rect_dx, @fn:fdiv(@cfg:govern.blueprints.compound.w,
          2), 1), @fn:add(@var:site.min.1, @cfg:govern.blueprints.compound.rect_dy, @cfg:govern.blueprints.compound.h, -1),
          @fn:sub(@cfg:govern.blueprints.compound.w, @fn:fdiv(@cfg:govern.blueprints.compound.w, 2), 1), 1)'
        stuff: '@fn:stuff(@cfg:start.shelter.stuff_preference)'
      - def: '@cfg:start.shelter.wall_def'
        rect: '@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.blueprints.compound.rect_dx, @cfg:govern.blueprints.compound.w,
          -1), @fn:add(@var:site.min.1, @cfg:govern.blueprints.compound.rect_dy, 1), 1, @fn:sub(@fn:fdiv(@cfg:govern.blueprints.compound.h,
          2), 1))'
        stuff: '@fn:stuff(@cfg:start.shelter.stuff_preference)'
      - def: '@cfg:start.shelter.wall_def'
        rect: '@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.blueprints.compound.rect_dx, @cfg:govern.blueprints.compound.w,
          -1), @fn:add(@var:site.min.1, @cfg:govern.blueprints.compound.rect_dy, @fn:fdiv(@cfg:govern.blueprints.compound.h,
          2), 1), 1, @fn:sub(@cfg:govern.blueprints.compound.h, @fn:fdiv(@cfg:govern.blueprints.compound.h, 2), 1))'
        stuff: '@fn:stuff(@cfg:start.shelter.stuff_preference)'
      - def: '@cfg:start.shelter.wall_def'
        rect: '@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.blueprints.compound.rect_dx, @cfg:govern.blueprints.compound.entrance_dx,
          -1), @fn:sub(@fn:add(@var:site.min.1, @cfg:govern.blueprints.compound.rect_dy), @cfg:govern.blueprints.compound.hall_depth),
          1, @cfg:govern.blueprints.compound.hall_depth)'
        stuff: '@fn:stuff(@cfg:start.shelter.stuff_preference)'
      - def: '@cfg:start.shelter.wall_def'
