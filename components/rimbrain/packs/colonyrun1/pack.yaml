      def: '@cfg:govern.floors.floor_def'
      rect: '@fn:rect(@fn:add(@var:site.min.0, 1), @fn:sub(@var:site.min.1, @cfg:govern.expansion.room_h), @fn:sub(@cfg:govern.expansion.room_w,
        2), @fn:sub(@cfg:govern.expansion.room_h, 2))'
      fill: true
  - template: lay-floor
    cooldown_polls: '@cfg:govern.floors.redo_polls'
    when:
      all:
      - field: '@fn:enclosed_at(@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.expansion.room_w, 1), @fn:sub(@var:site.min.1,
          @fn:add(@cfg:govern.expansion.room_h, 1)), @cfg:govern.expansion.room_w, @cfg:govern.expansion.room_h), @cfg:govern.expansion.min_room_cells)'
        op: gte
        value: 1
      - field: '@fn:terrain_at(@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.expansion.room_w, 2), @fn:sub(@var:site.min.1,
          @cfg:govern.expansion.room_h), @fn:sub(@cfg:govern.expansion.room_w, 2), @fn:sub(@cfg:govern.expansion.room_h, 2)))'
        op: ne
        value: '@cfg:govern.floors.floor_def'
    params:
      def: '@cfg:govern.floors.floor_def'
      rect: '@fn:rect(@fn:add(@var:site.min.0, @cfg:govern.expansion.room_w, 2), @fn:sub(@var:site.min.1, @cfg:govern.expansion.room_h),
        @fn:sub(@cfg:govern.expansion.room_w, 2), @fn:sub(@cfg:govern.expansion.room_h, 2))'
      fill: true
options:
- id: secure-shelter-and-beds
  summary: Enclosed roofed room with a bed per colonist, table, and a first recreation item.
  survival_benefit: 'Removes exposure/Outdoor-sleep failure modes: slept-outside and no-table mood debuffs, deteriorating
    items left outdoors; first failure cascade stopper.'
  investment: low — ~1 day of construction work; wood/steel for ~13x13 room, beds, horseshoe pin (guide 00:10-00:13).
  wealth_impact: low positive — building wealth counts at 0.5x; furniture is cheap.
  raid_threat_impact: neutral — trivial wealth added; no defensive value itself, but prevents mood-collapse spirals that cost
    pawns.
  phase: early
  prerequisites: []
  sources:
  - guide ~00:10-00:14 (13x13 shack, beds, horseshoe pin)
  - guide ~00:48 (base planning)
- id: establish-food-security
  summary: 'Renewable food: growing zone on best soil (rice), cooking, and a freezer buffer.'
  survival_benefit: Prevents starvation — the baseline survival failure. ~2 meals/pawn/day; ~15-30 crop tiles per pawn depending
    on meal tier; freezer at -5C stops spoilage loss.
  investment: medium — ongoing grower/cook work; power + cooler for freezer; farmland.
  wealth_impact: low-medium positive — crops/meals are item wealth; keep buffer sized to need, excess food is a major hoarded-wealth
    source (guide 03:32:27).
  raid_threat_impact: slightly negative — overstocked meals/raw food inflate item wealth with zero combat value; right-size
    the buffer.
  phase: early
  prerequisites:
  - secure-shelter-and-beds
  sources:
  - guide ~01:19-01:33 (crops/pawn math, nutrient paste, freezer -5C)
  - 'wiki: Wealth management (overproduction warning)'
- id: arm-every-colonist
  summary: Every combat-capable pawn equipped; ranged to best shooters, melee + armor to front-line.
  survival_benefit: An unarmed colonist is a dead colonist in the first raid; day-one arming is the cheapest defense there
    is.
  investment: low — starting weapons suffice; later ~60 steel + 7 components per assault rifle.
  wealth_impact: low positive — weapons are item wealth but worn gear pulls double duty.
  raid_threat_impact: positive — best defense-per-wealth-point available early; combat-capable coverage beats stockpiled gear.
  phase: early
  prerequisites: []
  sources:
  - guide ~01:58:17-01:58:40 (weapons to best shooters)
  - guide ~02:08:56 (rush assault rifles)
- id: build-chokepoint-defense
  summary: Spike-trap corridor / choke point with an open-door funnel so raiders path through it.
  survival_benefit: Kills early raiders and animals with zero pawn damage — 'always fight in choke points, always use spike
    traps, always kite' (guide 02:01:47).
  investment: low — wood/steel spike traps (wood 8 dmg, steel 20), a wall line, auto-rearm enabled.
  wealth_impact: minimal — traps and walls are cheap building wealth at 0.5x.
  raid_threat_impact: positive — large defensive return for almost no wealth; keeps early raids below pawn capacity.
  phase: early
  prerequisites:
  - secure-shelter-and-beds
  sources:
  - guide ~01:58:40-02:03 (spike traps, open-door funnel, cover)
  - guide ~01:00:08 (early barricade fallback)
- id: stockpile-medicine
  summary: Grow healroot, buy/hold industrial medicine, medic carries medicine; build a clean hospital room.
  survival_benefit: Untreated wounds and infections kill; tend speed decides survival. Recovery speed between raids is the
    real attrition war (guide 04:53:59).
  investment: low-medium — healroot plot, ~24-30 silver/medicine bought, dedicated room + beds.
  wealth_impact: low positive — medicine is valuable item wealth but consumed on use; keep a working stock, not a hoard.
  raid_threat_impact: positive — converts raid damage into recoverable injuries instead of lost pawns (lost pawns both hurt
    defense and feed the adaption factor downward pressure... deaths reduce adaption but cost capability).
  phase: early
  prerequisites:
  - establish-food-security
  sources:
  - guide ~00:18:02 (healroot)
  - guide ~01:10:40 (hospital)
  - guide ~03:38:03 (medic carries medicine)
  - guide ~04:53:59-04:54:36 (recovery wins wars)
- id: maintain-mood-stability
  summary: Recreation variety (6 types), impressive shared rooms, apparel >51% HP policy, scheduled drug policy.
  survival_benefit: Prevents mental breaks — berserk/tantrum/run-wild pawns during raids or crises are a top colony-killer.
  investment: low-medium — rec items, dining/rec room combined for double impressiveness, cheap drug crops.
  wealth_impact: low positive — art/furniture wealth; combining rooms gets 2-3x moodlets per wealth point.
  raid_threat_impact: neutral-positive — breaks during defense cause deaths; wealth cost is small.
  phase: early
  prerequisites:
  - secure-shelter-and-beds
  sources:
  - guide ~04:03:12 (6 rec types)
  - guide ~05:42:18-05:43 (mood-threshold drug policy)
  - guide ~03:38:19 (apparel HP policy)
  - 'wiki: Wealth management (multi-function rooms)'
- id: establish-power-grid
  summary: Wind/wood-fueled generation plus researched batteries; hidden conduits where affordable.
  survival_benefit: Unlocks freezer, lights (work/move speed), turrets, heaters — everything downstream needs power.
  investment: medium — batteries research, generator + battery + conduit materials.
  wealth_impact: medium positive — building wealth at 0.5x; batteries are a modest chunk.
  raid_threat_impact: neutral — enables defense (turrets) and food security (freezer); hidden conduits remove short-circuit
    explosion risk (guide 04:04:53).
  phase: early
  prerequisites:
  - secure-shelter-and-beds
  sources:
  - guide ~00:16:22 (wind + battery)
  - guide ~00:53:08 (power choice)
  - guide ~04:04:53 (hidden conduits)
- id: research-core-tech
  summary: 'Research bench + priority path: batteries, solar, microelectronics (comms), precision rifling, fabrication.'
  survival_benefit: Defense tech buys time to research everything else; fabrication removes the component bottleneck that
    stalls the whole colony.
  investment: medium — a research-capable pawn's ongoing work-time; bench + lab room.
  wealth_impact: minimal — benches are cheap building wealth.
  raid_threat_impact: positive — better weapons/defense tech raises defense faster than research adds wealth.
  phase: early-mid
  prerequisites:
  - establish-power-grid
  sources:
  - guide ~03:02-03:18 (full research order + skips)
  - guide ~03:16:45 (defenses/microelectronics/fabrication priority)
- id: recruit-for-skill-gaps
  summary: Prisoner room + warden recruitment to fill missing core skills (construction, plants, medical, social).
  survival_benefit: Missing skills stall the colony; each recruit adds a worker and a gun. Avoid old/addicted/violence-incapable
    pawns early (guide 04:09-04:12).
  investment: medium — prisoner beds/food, warden time over days-weeks of resistance.
  wealth_impact: high positive — each pawn adds market value AND a pawn-point entry (15 + (wealth-10k)/3120 pts below 400k).
  raid_threat_impact: mixed — pawns are the most expensive scaling factor after raw wealth; recruit for capability, not headcount.
    Healthy pawns count full; keeping them healthy matters.
  phase: early-mid
  prerequisites:
  - establish-food-security
  - maintain-mood-stability
  sources:
  - guide ~00:29:16 (prisoner room)
  - guide ~04:09:28-04:12 (recruit to cover gaps, avoid bad recruits)
  - 'wiki: Raid points (pawn points)'
- id: build-compound-wall
  summary: Perimeter wall enclosing base + fields with a single controlled entrance feeding the trap corridor.
  survival_benefit: Stops raiders wandering to crops/coolers/colonists; forces all threats through the prepared funnel. Protects
    cooler units and fields from torching.
  investment: medium-high — many wall segments (stone blocks preferred over flammable wood).
  wealth_impact: medium positive — large building footprint, but at 0.5x storyteller rate.
  raid_threat_impact: positive — controls attacker geometry; wealth cost is half-rated building wealth.
  phase: mid
  prerequisites:
  - build-chokepoint-defense
  sources:
  - guide ~02:06:25-02:07 (compound phase)
  - guide ~03:42:00 (coolers are raid-bait)
- id: construct-killbox
  summary: 'Long firing-lane killbox sized to assault-rifle range: sandbag cover, roofed firing line, declumping turret at
    entry.'
  survival_benefit: Converts numerical inferiority into a shooting gallery; an unpowered turret at the corridor entrance makes
    raiders stack up instead of flooding in (guide 02:09:57).
  investment: high — construction work, sandbags/walls, roofing, lights, one turret.
  wealth_impact: medium positive — mostly building wealth at 0.5x.
  raid_threat_impact: strongly positive — the core mid-game answer to raid scaling; defense output far exceeds its wealth
    cost.
  phase: mid
  prerequisites:
  - build-compound-wall
  - research-core-tech
  sources:
  - guide ~02:09:44-02:17 (killbox construction, declump turret, roofed firing line)
- id: deploy-turret-screen
  summary: Spaced mini/autocannon/uranium-slug turrets covering the killbox and compound approaches.
  survival_benefit: Turrets add free firepower and act as distractors/ablative targets; spaced to prevent chain explosions
    (guide 04:04:31).
  investment: medium-high — steel + components per turret, power draw.
  wealth_impact: medium positive — building wealth at 0.5x plus component cost.
  raid_threat_impact: positive — scales defense with raid points; costs components, so pair with secure-component-supply.
  phase: mid
  prerequisites:
  - construct-killbox
  - establish-power-grid
  sources:
  - guide ~02:17-02:25 (turret types/placement)
  - guide ~04:04:31 (spacing vs chain explosion)
- id: secure-component-supply
  summary: Buy components early on every trader visit; later deep drilling + fabrication bench to self-supply.
  survival_benefit: Components are 'the biggest bottleneck you will ever undergo' (guide 03:24:07); no components = no turrets,
    no fabrication, stalled colony.
  investment: medium — recurring silver (~43/component bought); fabrication needs advanced components + research.
  wealth_impact: neutral-low — components are compact item wealth; spend silver (pure wealth) for capability.
  raid_threat_impact: positive — converts passive silver wealth into defense-enabling materials.
  phase: early-mid
  prerequisites:
  - open-trade-routes
  sources:
  - guide ~03:24:07-03:24:34 (buy components until fabrication)
  - guide ~03:16:49 (deep drilling, fabrication)
- id: open-trade-routes
  summary: Regular caravans to neutral factions (~30d restock), comms console + trade beacon, best-social pawn trades.
  survival_benefit: Buys what you can't make (components, medicine, weapons); sells surplus; gifts build goodwill into allies.
  investment: medium — a pawn + pack animal absent for days; comms console needs microelectronics.
  wealth_impact: reduces net wealth — selling at the built-in loss (~60% value) converts items to less silver; caravan cargo
    doesn't count while off-map.
  raid_threat_impact: positive — main valve for the wealth-control strategy; trades dead item value for capability or goodwill.
  phase: mid
  prerequisites:
  - establish-food-security
  sources:
  - guide ~03:19-03:24 (caravan cadence, comms console, social trader)
  - guide ~04:07:35 (settle near traders)
  - 'wiki: Wealth management (sell-at-loss lowers wealth)'
- id: produce-export-goods
  summary: 'Convert labor into sellables: flake (not yayo), quality clothing/dusters, spare armor; optional organ harvest.'
  survival_benefit: Funds component/medicine/weapon purchases; goods are compact value that converts to capability.
  investment: medium — psychoid/cloth plots, crafter work, drug lab.
  wealth_impact: high positive while held — unsold goods and silver both count; only worthwhile if regularly converted via
    open-trade-routes.
  raid_threat_impact: negative if hoarded, neutral-positive if cycled — production for its own sake inflates wealth; sell
    or gift the output.
  phase: mid
  prerequisites:
  - open-trade-routes
  - maintain-mood-stability
  sources:
  - guide ~03:26:50-03:29 (flake > yayo, dusters, organs ~1783 silver)
  - 'wiki: Wealth management (don''t produce for money''s sake)'
- id: cap-idle-wealth
  summary: 'Keep-wealth-low discipline: don''t overproduce, sell/gift surplus, destroy trash gear, park overflow in caravans.'
  survival_benefit: 'Directly shrinks raid points: ~139 storyteller wealth per raid point at 3 colonists (less per point as
    pop grows). Prevents ''too rich too quick'' raid compounding.'
  investment: low — hauling/destroy work, occasional gifting caravan; opportunity cost of a leaner stockpile.
  wealth_impact: 'negative — the goal IS reducing wealth: gifts destroy it, sales convert below market, deterioration/caravan-parking
    hide it.'
  raid_threat_impact: strongly positive — the only lever that lowers raid size instead of racing it; most valuable at high
    threat scale (Losing is Fun 220%+).
  phase: mid-late
  prerequisites:
  - open-trade-routes
  sources:
  - guide ~03:31:28-03:35 (small stockpile, sell/gift wealth away)
  - 'wiki: Wealth management (control strategies)'
  - 'wiki: Raid points (wealth curve)'
- id: invest-wealth-in-defense
  summary: 'Spend-down before wealth spikes: convert silver/goods into weapons, armor, components, doomsday/triple rockets,
    artifacts.'
  survival_benefit: Turns raid-scaling wealth into raid-beating capability; consumables (rockets, lances) delete raids then
    leave no wealth behind.
  investment: high — silver stockpile spent on trader visits; production materials.
  wealth_impact: neutral-to-negative net — trades 1x-counted silver for capability items; used consumables remove wealth entirely.
  raid_threat_impact: 'positive — the wealth-investment alternative to cap-idle-wealth: keep wealth only where it fights.'
  phase: mid-late
  prerequisites:
  - open-trade-routes
  - construct-killbox
  sources:
  - guide ~03:32:47 ('immediately expand upon defenses' when rich)
  - 'wiki: Wealth management (investment strategies: rockets, barrels, artifacts)'
- id: sustain-post-raid-recovery
  summary: 'Maintain recovery reserve: medicine, repair materials (blocks), hospital capacity, backup parts for turrets/mortars.'
  survival_benefit: Late raids are an attrition war — 'not about winning the fight, but how fast you recover' (guide 04:53:59).
    Reserve stockpiles decide whether the next raid is survivable.
  investment: medium — standing reserve of medicine, blocks, components, spare barrels; hospital beds.
  wealth_impact: medium positive — reserves are item wealth; justified because they're consumed exactly when threat peaks.
  raid_threat_impact: positive — healthy pawns fight at full pawn-point value and capability; repair speed keeps defenses
    online between raids.
  phase: late
  prerequisites:
  - stockpile-medicine
  - secure-component-supply
  sources:
  - guide ~04:53:59-04:54:36 (recovery is the real battle)
  - guide ~04:54:36 (backup resource stockpile, hospital)
- id: launch-ship-endgame
  summary: Research the full ship tree, build reactor + cryptosleep caskets, survive the launch window.
  survival_benefit: Victory condition — ends the game; alternatively take the Ship to the Stars quest to a ready ship.
  investment: high — deep research tree (fabrication onward), large material build, days of reactor startup under attack.
  wealth_impact: high positive — ship parts are expensive building/item wealth; irrelevant once launched.
  raid_threat_impact: negative — reactor activation forces raids at min 500 raid points regardless of threat scale; wealth
    peaks right when raids do. Stockpile first (sustain-post-raid-recovery).
  phase: late
  prerequisites:
  - research-core-tech
  - sustain-post-raid-recovery
  - invest-wealth-in-defense
  sources:
  - guide ~04:53:38 (prepare for ship launch)
  - guide ~05:40:59 (Ship to the Stars alternative)
  - guide ~07:00 (reactor launch, 23 raids)
  - 'wiki: Raid points (reactor min 500)'
decide:
  select:
    role: rimbrain.select
    batch_pawns: true
    fallback: priority_head
    shadow: true
    cadence_polls: 1
    rung: shadow
    pawn_instructions: 'combat: pick this pawn''s action — strike an enemy in weapon range, close distance, kite, retreat,
      or hold at rally. Nearest threats first; never mix melee into a ranged firing line.'
    pawn_scope:
      for_each: colonists
      context:
        me: '@fn:combat_card(@var:it.id)'
        enemies: '@fn:hostile_cards(@var:it.id)'
        squad: '@fn:squad_card()'
      options:
      - id: combat-retreat
        label: retreat to safety
        template: move-pawn
        when:
          all:
          - not:
              field: '@fn:touched(@var:it.id)'
              op: truthy
          - any:
            - field: '@fn:outranged_by(@var:it.id)'
              op: truthy
            - field: '@fn:outrun_by(@var:it.id)'
              op: truthy
            - field: '@fn:health_of(@var:it.id)'
              op: lt
              value: '@cfg:combat.min_health'
        needs: '@fn:safe_cell(@var:it.id)'
        params:
          pawn: '@var:it.id'
          cell: '@fn:safe_cell(@var:it.id)'
        priority: '@cfg:combat.option_weights.combat-retreat'
      - id: combat-relief
        label: stand down for relief
        template: draft-pawn
        when:
          all:
          - not:
              field: '@fn:touched(@var:it.id)'
              op: truthy
          - any:
            - field: '@fn:need_of(@var:it.id, ''rest'')'
              op: lt
              value: '@cfg:combat.relief.rest'
            - field: '@fn:need_of(@var:it.id, ''food'')'
              op: lt
              value: '@cfg:combat.relief.food'
        params:
          pawn: '@var:it.id'
          drafted: false
        priority: '@cfg:combat.option_weights.combat-relief'
      - id: combat-focus
        label: squad focus-fire
        template: attack-target
        when:
          all:
          - field: '@fn:draftable(@var:it.id)'
            op: truthy
          - field: '@fn:fighter_engages(@var:it.id)'
            op: truthy
          - field: '@fn:engaged_hostiles()'
            op: not_empty
        needs: '@fn:focus_target()'
        params:
          pawn: '@var:it.id'
          target: '@fn:focus_target()'
        priority: '@cfg:combat.option_weights.combat-focus'
      - id: combat-kite
        label: kite the threat
        template: move-pawn
        when:
          all:
          - field: '@fn:draftable(@var:it.id)'
            op: truthy
          - field: '@fn:outranges(@var:it.id, @fn:nearest_engaged(@var:it.pos))'
            op: truthy
          - not:
              field: '@fn:outrun_by(@var:it.id)'
              op: truthy
        needs: '@fn:kite_cell(@var:it.id)'
        params:
          pawn: '@var:it.id'
          cell: '@fn:kite_cell(@var:it.id)'
        priority: '@cfg:combat.option_weights.combat-kite'
      - id: combat-block
        label: block the breach
        template: move-pawn
        when:
          all:
          - field: '@fn:draftable(@var:it.id)'
            op: truthy
          - field: '@fn:combat_mode()'
            op: eq
            value: overrun
          - field: '@fn:enemy_mix().melee'
            op: gt
            value: 0
          - field: '@fn:skill_of(@var:it.id, ''melee'')'
            op: gte
            value: '@cfg:combat.chase_skill'
        needs: '@fn:block_cell(@var:it.id)'
        params:
          pawn: '@var:it.id'
          cell: '@fn:block_cell(@var:it.id)'
        priority: '@cfg:combat.option_weights.combat-block'
      - id: combat-chase
        label: chase the fleeing
        template: attack-target
        when:
          all:
          - field: '@fn:draftable(@var:it.id)'
            op: truthy
          - field: '@fn:fighter_engages(@var:it.id)'
            op: truthy
          - field: '@fn:skill_of(@var:it.id, ''shooting'')'
            op: gte
            value: '@cfg:combat.chase_skill'
          - field: '@fn:ticks_since_hostile()'
            op: lt
            value: '@cfg:combat.release_ticks'
        needs: '@fn:nearest_fleeing(@var:it.pos)'
        params:
          pawn: '@var:it.id'
          target: '@fn:nearest_fleeing(@var:it.pos)'
        priority: '@cfg:combat.option_weights.combat-chase'
      - id: combat-strike
        label: strike
        for_each: targetable_hostiles
        template: attack-target
        when:
          all:
          - field: '@fn:draftable(@var:it.id)'
            op: truthy
          - field: '@fn:fighter_engages(@var:it.id)'
            op: truthy
          - not:
              field: '@fn:touched(@var:it.id)'
              op: truthy
          - any:
            - field: '@fn:range_class(@var:it.id)'
              op: eq
              value: melee
            - field: '@fn:in_range(@var:it.id, @var:target.id)'
              op: truthy
        params:
          pawn: '@var:it.id'
          target: '@var:target.id'
        priority: '@fn:sub(100, @fn:dist_to(@var:it.id, @var:target.id))'
      - id: combat-close
        label: close distance on
        for_each: targetable_hostiles
        template: move-pawn
        when:
          all:
          - field: '@fn:draftable(@var:it.id)'
            op: truthy
          - field: '@fn:fighter_engages(@var:it.id)'
            op: truthy
          - not:
              field: '@fn:touched(@var:it.id)'
              op: truthy
          - field: '@fn:range_class(@var:it.id)'
            op: ne
            value: melee
          - not:
              field: '@fn:in_range(@var:it.id, @var:target.id)'
              op: truthy
        needs: '@fn:pos_of(@var:target.id)'
        params:
          pawn: '@var:it.id'
          cell: '@fn:pos_of(@var:target.id)'
        priority: '@fn:sub(90, @fn:dist_to(@var:it.id, @var:target.id))'
      - id: combat-shelter
        label: shelter in Home
        template: move-pawn
        when:
          all:
          - field: '@fn:draftable(@var:it.id)'
            op: truthy
          - not:
              field: '@fn:fighter_engages(@var:it.id)'
              op: truthy
          - field: '@fn:engaged_hostiles()'
            op: not_empty
          - not:
              field: '@fn:touched(@var:it.id)'
              op: truthy
        needs: '@fn:safe_cell(@var:it.id)'
        params:
          pawn: '@var:it.id'
          cell: '@fn:safe_cell(@var:it.id)'
        priority: '@cfg:combat.option_weights.combat-move'
      - id: combat-move
        label: take rally position
        template: move-pawn
        when:
          all:
          - field: '@fn:draftable(@var:it.id)'
            op: truthy
          - field: '@fn:engaged_hostiles()'
            op: not_empty
        needs: '@fn:rally_cell(@var:it.id)'
        params:
          pawn: '@var:it.id'
          cell: '@fn:rally_cell(@var:it.id)'
        priority: '@cfg:combat.option_weights.combat-move'
  plan:
    role: rimbrain.plan
    cadence_s: 150
    on_phase_boundary: true
rooms:
  tier_table: auto
  archetypes:
    barracks:
      size:
        w: 7
        h: 7
      wall: Wall
      door: Door
      floor: WoodPlankFloor
      stuff_preference:
      - WoodLog
      - Steel
      furniture:
      - def: Bed
        count: 4
        anchor: wall
      - def: StandingLamp
        count: 1
        optional: true
    bedroom:
      tier_target: average
      stat_target:
        impressiveness: 40
      wall: Wall
      door: Door
      floor: WoodPlankFloor
      stuff_preference:
      - WoodLog
      - Steel
      furniture:
      - def: Bed
        count: 1
        anchor: wall
      - def: Dresser
        linked_to: Bed
      - def: EndTable
        linked_to: Bed
      - def: StandingLamp
        count: 1
      - def: PlantPot
        optional: true
